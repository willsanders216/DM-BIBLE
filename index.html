<p><strong>Full backstory — never shown to players directly, only theorized via environmental storytelling.</strong></p>
<p>Grew up happy on Crabshack as a young girl, with a family. Talk of the sea, and something about it calling to her, planted the seed of adventure early. She snuck off with a passing pirate crew, seeing it as an adventure rather than what it actually was. A storm hit and she was separated from the ship, washing up alone on the island now known as No Man's Land.</p>
<p>She found a large tree with a hollow at its base and made it her home — this is the tree hollow the party finds in the forest, the earliest chronological point in her story. She found what she thought was a duvet hanging in a tree and dragged it down; it was actually a badly-skinned animal carcass. She built a bed from leaves tied together with roots, plus the "duvet," and collected trinkets from her adventures to display on a shelf — these were actually skulls and bones.</p>
<p>She kept a comic-strip-style diary of all this from her own happy, childlike point of view, labeling her trinkets things like "shiny one" and "my favorite." The drawings start upbeat and adventurous, then gradually grow less animated, then stop altogether — the stopping point marks where her isolation began breaking her down.</p>
<p>Early on, she built a mouth to act as her "man in the chair" — a helper for her ongoing adventure, genuinely eager and still under the impression she was on a temporary quest and would be heading home soon. It's still there in the tree hollow, frozen in that loyal, unaware state.</p>
<p>As isolation set in, doubt followed. She built two more mouths, styled to look like her, to let her deliberate with herself over what actually happened to her: was she tricked into leaving home by a demon, or is she secretly the chosen one meant to save the world? She landed on believing she was tricked by a demon over believing she was chosen — settling on victimhood over grandeur.</p>
<p>Next she tried to hold onto her humanity, building a room full of mundane mouths — twenty-six of them, tucked into ordinary books — to have small talk and comfort conversations with, an attempt to simulate a normal life and stay sane.</p>
<p>Over time the isolation wore down her sanity entirely, and she became desperate for real connection. The island itself seemed to grant her power as this happened, and that power fed her insanity further. She began collecting lost souls and forcing them into her vision of "family," sometimes without even being aware she was doing it. Her most recent, most composed self is a woman who still performs being a grand adventurer — a study with a desk and a map, planning trips she'll never take — but who is now, at her core, a single desperate mouth and eye longing for genuine happiness.</p>
<p>At some point, the trapped prophecy captain was drawn to the island via her involuntary charm vision on his way to Richman's Rock, and got stuck there. He figured out the only way to eventually escape was to cozy up to her, earn her trust, and play along with her delusion — she now believes he's her husband, and that he's coming back to her any minute. When confronted, she uses this belief as a scare tactic before turning hostile.</p>
<p><strong>None of this backstory has been confirmed to the party — it should only ever be theorized, never stated outright, via the room-by-room descent in the Session Plan.</strong></p>
</div>` },

    { id:'c7', num:'Chapter VI', title:'Factions', type:'html', content:`<div class="faction-card"><div class="fname">Crabshack Pirates</div><p>Led by <strong>Snarlywinkle</strong>. Was part of the original prophecy captain's crew, abandoned when the captain found his first clue. Believes the captain made it out alone; built a whole pirate community at Crabshack (enslaving/replacing its original monk inhabitants, disguised as animals) hoping enough trust and manpower would help him recover the amulet himself — he never actually received the prophecy. Asked the party to help plan a siege on the amulet; they snuck in ahead and took it themselves, badly damaging his standing and their relationship with him. Party is due to cross his ship on the way out of the stronghold — an unplanned, tense encounter still to come. He doesn't yet know they pulled off the heist themselves.</p></div>
<div class="faction-card"><div class="fname">Sea Witches</div><p>First sentient life in the inner boundary; discovered magic, ruled for a time, then were overthrown/enslaved by the pirates once pirates learned to bind their power via magical contracts. Recently freed by the party — friendly for now. Future split planned: witches wanting their coven restored vs. witches bent on revenge — may align with Davin's agenda.</p></div>
<div class="faction-card"><div class="fname">The Navy</div><p>Led by Aric. Officially keeps the peace in the inner boundary; in practice, rules increasingly through fear and undead soldiers of unclear origin.</p></div>
<div class="faction-card"><div class="fname">Bullywugs <span style="font-weight:normal;font-style:italic;">(rising importance)</span></div><p>Frog-folk faction — gaining significance going forward. Details to fill in as they become relevant.</p></div>
<div class="faction-card"><div class="fname">The Levellers <span class="status-tag">Not Active</span></div><p>An underground criminal gang from Nevirismuth — the group that abducted and raised Cheese n Wine. Their Inner Boundary branch is hidden in a cave in a volcanic valley, more pirate-flavored than their other operations. Not yet brought into the current story.</p></div>
<div class="faction-card"><div class="fname">Blood Hunters <span class="status-tag">Held in Reserve</span></div><p>From an earlier campaign group's worldbuilding, not currently part of this story. A faction born from a century-long obsession with replicating sea witch magic, who developed blood magic (fueled by the user's own blood) to try to reach the sea witches themselves. First generations were brutal and selfish; over time that's all that remained. Kept in reserve as an easy faction to introduce later if wanted.</p></div>
<h3>District 1 Gangs</h3>
<div class="secret"><p><strong>DM secret — the real mechanism.</strong> None of District 1's five gangs are government-run — all are genuine, resident-formed organizations. Pastor Swanky and Jack Wes were both planted in District 1 with the same government brief: keep the district's gang rivalries and infighting alive, since that ongoing chaos is what actually keeps residents trapped and unable to climb to District 2. Neither the gangs nor most residents know this. The two agents have since diverged wildly — see their individual entries in the Session Plan for how.</p></div>
<p>Tap a gang below for its full page — tag, roster, racket, and its own plotline the party can pick up.</p>
<div class="hub-grid">
  <a href="#" class="hub-card" onclick="showView('gang-crown');return false;"><div class="hc-name">The Crown</div><div class="hc-sub">Top gang — trafficking &amp; muscle</div></a>
  <a href="#" class="hub-card" onclick="showView('gang-wildcats');return false;"><div class="hc-name">The Wildcats</div><div class="hc-sub">Runs the Battle Arena</div></a>
  <a href="#" class="hub-card" onclick="showView('gang-congregation');return false;"><div class="hc-name">The Congregation</div><div class="hc-sub">Radical faith — secretly Swanky's</div></a>
  <a href="#" class="hub-card" onclick="showView('gang-underlings');return false;"><div class="hc-name">The Underlings</div><div class="hc-sub">Sewer-dwelling sea folk</div></a>
  <a href="#" class="hub-card" onclick="showView('gang-awakened');return false;"><div class="hc-name">The Awakened <span style="font-weight:normal;font-style:italic;">("the Doomers")</span></div><div class="hc-sub">Death cult — afterlife obsessed</div></a>
  <a href="#" class="hub-card" onclick="showView('district1-police');return false;"><div class="hc-name">District 1 Police</div><div class="hc-sub">Corrupt cops — stub, expand later</div></a>
</div>` },

    { id:'gang-crown', num:'Reference', title:'The Crown', sub:true, type:'html', content:`<div style="text-align:center;margin:6px 0 14px;"><svg viewBox="0 0 100 60" width="130" height="78"><polyline points="8,55 8,20 28,38 50,12 72,38 92,20 92,55" fill="none" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="55" x2="92" y2="55" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round"/></svg></div>
<div class="info-block"><div class="info-name">Standing</div><p>The dominant gang in District 1, only seriously rivaled by the Wildcats. Revered and feared in equal measure — Peaky Blinders swagger with a cowboy edge.</p></div>
<div class="info-block"><div class="info-name">Roster</div><p>All brutes — the biggest, scariest people in the district. Muscle is the whole recruiting pitch.</p></div>
<div class="info-block"><div class="info-name">Racket</div><p>Drug trafficking and the district's serious organized crime — the real illegal trade, not petty stuff.</p></div>
<div class="info-block"><div class="info-name">Why they stay</div><p>Wealthy enough to buy their way up to District 2, but they'd rather be on top here than at the bottom there. Same philosophy as the Wildcats.</p></div>
<div class="info-block"><div class="info-name">Plotline status</div><p>Open — not yet started at the table.</p></div>` },

    { id:'gang-wildcats', num:'Reference', title:'The Wildcats', sub:true, type:'html', content:`<div style="text-align:center;margin:6px 0 14px;"><svg viewBox="0 0 100 100" width="110" height="110"><line x1="15" y1="45" x2="55" y2="10" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round"/><line x1="30" y1="65" x2="75" y2="25" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round"/><line x1="45" y1="85" x2="90" y2="45" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round"/></svg></div>
<div class="info-block"><div class="info-name">Standing</div><p>Second most powerful gang in District 1 — dominate the Battle Arena, east side.</p></div>
<div class="info-block"><div class="info-name">Roster</div><p>Led by cat-people. Ranks otherwise filled by other quick, sly, selfish types who choose to join for the same speed-and-cunning ethos — assassin-type fighters, not exclusively cat-folk.</p></div>
<div class="info-block"><div class="info-name">Racket</div><p>Own the Arena fight system outright. Big, brooding fighters come in trying to win prizes off them — the Wildcats always win, playing speed and dexterity against the other side's raw strength. Earns District 1 (and the government) enough money that they're left to run it their way.</p></div>
<div class="info-block"><div class="info-name">Why they stay</div><p>Rich enough to buy up to District 2, but choose to stay on top in District 1 rather than start again at the bottom. Same philosophy as the Crown.</p></div>
<div class="info-block"><div class="info-name">Plotline status</div><p>Open — Arena thread not yet started at the table.</p></div>` },

    { id:'gang-congregation', num:'Reference', title:'The Congregation', sub:true, type:'html', content:`<div style="text-align:center;margin:6px 0 14px;"><svg viewBox="0 0 100 100" width="90" height="90"><line x1="50" y1="8" x2="50" y2="92" stroke="var(--maroon)" stroke-width="7" stroke-linecap="round"/><line x1="20" y1="78" x2="80" y2="78" stroke="var(--maroon)" stroke-width="7" stroke-linecap="round"/></svg><p style="font-size:11px;color:#6b5a3a;font-style:italic;margin-top:4px;">upside-down cross</p></div>
<div class="info-block"><div class="info-name">Public face</div><p>A low-level, radically devout gang — one of the weaker organizations in District 1 on paper.</p></div>
<div class="secret"><p><strong>DM-only secret.</strong> The Congregation is secretly <span class="xref" onclick="return jumpTo('gang-congregation','')">Pastor Swanky's</span> personal vehicle. He publicly condemns them as blasphemous, defiling real faith — that condemnation is itself the manipulation. No one, including his fellow agent Jack Wes, knows he's their true leader. Behind closed doors he directs them toward demonic ritual practice — goal still being finalized, likely summoning a hellish being or banishing someone to the lower hells. This is separate from, and unknown to, the wider government chaos-mechanism he and Jack Wes run (see the District 1 Gangs hub secret).</p></div>
<div class="info-block"><div class="info-name">Plotline status</div><p>Open subplot — a slow-burn reveal thread tied to Pastor Swanky.</p></div>` },

    { id:'gang-underlings', num:'Reference', title:'The Underlings', sub:true, type:'html', content:`<div style="text-align:center;margin:6px 0 14px;"><svg viewBox="0 0 100 60" width="130" height="78"><polyline points="6,10 26,30 6,50" fill="none" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="38,10 58,30 38,50" fill="none" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="70,10 90,30 70,50" fill="none" stroke="var(--maroon)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><p style="font-size:11px;color:#6b5a3a;font-style:italic;margin-top:4px;">not worn as a tag — echoed by the sewer bars themselves</p></div>
<div class="info-block"><div class="info-name">Who they are</div><p>Sea creatures who never fit District 1's lack of water. The lowest-tier gang — poor, struggling, growing more violent out of desperation rather than power, though the violence isn't getting them anywhere. They still work together and look out for one another.</p></div>
<div class="info-block"><div class="info-name">Territory</div><p>Live under the sewers. No gang symbol of their own — but the sewer bars down there happen to share the same three-wave shape as their tag, a coincidence of the environment rather than a marking.</p></div>
<div class="secret"><p><strong>DM-only secret — the corruption.</strong> Extended time in the sewers' magically-corrupted silver water is slowly mutating some Underlings, creating a rift between them and their less-affected family members. The party's first sewer work shift (Gibbering Mouther encounter — see Session Plan) is their entry point into this whole underground situation. <span class="xref" onclick="return jumpTo('gang-underlings','')">Jack Wes</span> has been secretly taking extra sewer shifts to hunt and put down the fully-mutated ones himself, so their families don't have to — partly because he's still searching for his lost friend Jacob among them (see Jack Wes's entry — the arm and name tag in the Gibbering Mouther are Jacob's).</p></div>
<div class="info-block"><div class="info-name">Plotline status</div><p>Open — begins with the sewer shift encounter. The party may end up helping the Underlings find a way to live safely in the district.</p></div>` },

    { id:'gang-awakened', num:'Reference', title:'The Awakened ("the Doomers")', sub:true, type:'html', content:`<div style="text-align:center;margin:6px 0 14px;"><svg viewBox="0 0 100 100" width="100" height="100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--maroon)" stroke-width="6"/><circle cx="50" cy="48" r="18" fill="none" stroke="var(--maroon)" stroke-width="5"/><circle cx="43" cy="46" r="4.5" fill="var(--maroon)"/><circle cx="58" cy="46" r="4.5" fill="var(--maroon)"/><line x1="42" y1="64" x2="42" y2="76" stroke="var(--maroon)" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="66" x2="50" y2="80" stroke="var(--maroon)" stroke-width="4" stroke-linecap="round"/><line x1="58" y1="64" x2="58" y2="76" stroke="var(--maroon)" stroke-width="4" stroke-linecap="round"/></svg></div>
<div class="info-block"><div class="info-name">Names</div><p>Call themselves the Awakened — but they barely speak to outsiders, so almost nobody in District 1 actually knows that. Everyone else just calls them "the Doomers."</p></div>
<div class="info-block"><div class="info-name">Belief</div><p>Convinced escape from District 1 is impossible, and that an afterlife awaits — so death is preferable to staying. They quietly try to talk others into that same conclusion.</p></div>
<div class="info-block"><div class="info-name">Warning sign</div><p>Members, and people being drawn in, dress progressively darker and more gothic. A readable in-fiction cue the party can learn to notice.</p></div>
<p style="font-size:12px;color:#6b5a3a;font-style:italic;">Heavy subject matter — Will has already run session-zero-style conversations with the table about this content.</p>
<div class="info-block"><div class="info-name">Plotline status</div><p>Open — not yet started at the table.</p></div>` },

    { id:'district1-police', num:'Reference', title:'District 1 Police', sub:true, type:'html', content:`<div class="info-block"><p>Standard corrupt cops for now — deliberately kept bare. Occupy the three background guard buildings noted on the District 1 map (above the "200" sleeping block marker, just below Town, and southwest of the Penitentiary). Expand this page whenever Will wants to give them more texture; not yet built out.</p></div>` },

{ id:'timeline', num:'Chapter VII', title:'Master Timeline', type:'html', content:`<p><em>Living document — update this as sessions happen and as plans firm up. Inner boundary events on the left, wider world events on the right, connected to their point on the spine. Box size reflects how important the event is. Dashed "planned" boxes are placed at roughly the right point on the spine but don't have locked dates yet.</em></p>

<h3>Time Dilation Reference</h3>
<div class="tl-ref-table">
  <div class="ref-row"><span class="ref-label">Current ratio (at "Now")</span><span>~1.4 IB : 1 WW (inner boundary still slightly faster)</span></div>
  <div class="ref-row"><span class="ref-label">Decay rate</span><span>~1.9% per IB day (~12–13% per IB week), exponential</span></div>
  <div class="ref-row"><span class="ref-label">The Flip (parity, 1:1)</span><span>~Day 18 IB-time from Now (~2.5 IB weeks) — expected around/after the Crow's Nest</span></div>
  <div class="ref-row"><span class="ref-label">Extreme inversion (1 IB month ≈ 10 WW years)</span><span>~Day 275 IB-time from Now (~9 IB months)</span></div>
  <div class="ref-row"><span class="ref-label">Mechanism (unconfirmed, DM theory)</span><span>Magic ran fast when concentrated at the start; as it's spread thinner across more people/time, the inner boundary's relative speed keeps decaying — exponentially, not linearly. Ancient-era ratios (Marilda's voyage) were far more extreme because the curve was steeper then; it's been flattening for centuries.</span></div>
  <div class="ref-row"><span class="ref-label">Sea witch lifespan</span><span>Up to ~500 years — the oldest ones remember when this was much more extreme, and may be the only ones who can feel the flip coming</span></div>
</div>
<p><em>To reuse this model going forward: pick an elapsed IB-day count t since "Now," and ratio(t) ≈ 1.4 × e^(−0.019t). Recalibrate R0 and the flip target any time actual play reveals something that contradicts it — this is a working theory, not locked canon.</em></p>
<p><strong>Legend:</strong> box color = category (World History / Backstory / Milestone / Session Event / Planned). Column = side of the boundary. Where it matters, a small note flags whether the detail itself is known to players yet — not just the event.</p>

<div class="dual-timeline">
  <div class="dt-legend"><span>Inner Boundary</span><span>Wider World</span></div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-major"><span class="tl-cat history">World History</span><div class="tl-title">Sea Witches Discover Magic</div><div class="tl-date">Mar 3, Year 0 IBC</div><div class="tl-reveal">Not in the player bible</div><p>Time-keeping begins here. Communing with the ocean, sea witches become the first magic users in Aaarmundy.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat history">World History</span><div class="tl-title">Sea Witches Gain Power</div><div class="tl-date">Jun 12, Year 100 IBC</div><div class="tl-reveal">Not in the player bible</div><p>Magic use spreads and strengthens; sea witches become widely worshipped.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-major"><span class="tl-cat history">World History</span><div class="tl-title">Teleportation Banned</div><div class="tl-date">Nov 8, Year 200 IBC</div><div class="tl-reveal">Not in the player bible</div><p>Sea witches now properly lead the inner boundary. They reach out to other regions — poor reception — and ban teleportation magic to protect the secret of the arcane energy source.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-time-note">⏱ In this era, dilation is at its most extreme — thousands of inner-boundary days can pass in a single wider-world day.</div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-major"><span class="tl-cat milestone">Milestone</span><div class="tl-title">The Prophecy Captain's Voyage Begins</div><div class="tl-date">c. Apr 15, Year 215 IBC</div><div class="tl-reveal">Not in the player bible</div><p>The original captain (now trapped, needs 8 people — see Endgame chapter) sets out to escape the inner boundary and understand the wider world. Gathers a crew. Marilda — pulled by sea witch whispers promising she'd see Billy again — joins around this time.</p></div></div>
    <div></div><div class="tl-right"><div class="tl-box"><span class="tl-cat backstory">Backstory</span><div class="tl-title">Billy &amp; Marilda</div><div class="tl-reveal known">Known to players</div><p>Grew up in Amuli, Safire. Met young, married. (Player-known.)</p></div></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-major"><span class="tl-cat milestone">Milestone</span><div class="tl-title">Marilda Finds the First Artifact</div><div class="tl-date">c. Jul 22, Year 217 IBC</div><div class="tl-reveal known">Fact known — captain's role isn't</div><p>The amulet. Just after this, the captain — having gotten what he needed — abandons the crew. Marilda becomes a legendary pirate in her own right. (Players know she found the artifact and became legendary — not the captain's role in it.)</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box"><span class="tl-cat milestone">Milestone</span><div class="tl-title">Marilda Captured by Aric</div><div class="tl-date">c. Feb 9, Year 222 IBC</div><div class="tl-reveal">Not revealed — players only know "taken by someone"</div><p>Aric — then a low-level navy warden — captures her, forces marriage, uses her power and body. Later uses the amulet to seize control of the Navy.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-major"><span class="tl-cat milestone">Milestone</span><div class="tl-title">Marilda Escapes</div><div class="tl-date">Oct 3, Year 251 IBC</div><div class="tl-reveal known">Known to players</div><p>~29 IB years compressed into 1 WW day for Billy. She returns home, pregnant, tells Billy the child is his.</p></div></div>
    <div></div><div class="tl-right"><div class="tl-box"><span class="tl-cat backstory">Backstory</span><div class="tl-title">Marilda Returns</div><div class="tl-reveal known">Known to players</div><p>Only a day passed for Billy. They raise Tide together for 6 years.</p></div></div>
  </div>

  <div class="tl-time-note">⏱ Decades of inner-boundary time just passed in a single wider-world day for Billy — dilation is still near its ancient extreme here.</div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat history">World History</span><div class="tl-title">Quiet Years</div><div class="tl-date">Oct 3, Year 251 – May 18, Year 261 IBC</div><div class="tl-reveal">Not in the player bible</div><p>~10 IB years pass at a decaying (but still elevated) ambient rate while Marilda and Tide are safely in the wider world, not touching the boundary.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box"><span class="tl-cat milestone">Milestone</span><div class="tl-title">Tide &amp; Marilda Taken</div><div class="tl-date">May 18, Year 261 IBC</div><div class="tl-reveal known">Tide's capture is known; Marilda's link isn't confirmed</div><p>Aric recaptures both. Tide (age 6) raised as a Navy soldier, given the name Allistar. Marilda kept chained — grows more powerful the longer she stays near the arcane source, so Aric keeps her that way.</p></div></div>
    <div></div><div class="tl-right"><div class="tl-box"><span class="tl-cat backstory">Backstory</span><div class="tl-title">Tide &amp; Marilda Taken</div><div class="tl-reveal known">Known to players</div><p>Taken from Billy ~6 WW years after Marilda's return. Tide was six.</p></div></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat backstory">Backstory</span><div class="tl-title">Tide Escapes to Snarlywinkle</div><div class="tl-date">Dec 1, Year 294 IBC</div><div class="tl-reveal known">Known to players</div><p>~33 IB years raised as a Navy soldier before he escapes and joins Snarlywinkle's crew — not out of loyalty, but as his best shot at gaining the power/information to help his mother. Spends ~4 more years with Snarlywinkle before Billy finds him.</p></div></div>
    <div></div><div class="tl-right"><div class="tl-box size-minor"><span class="tl-cat backstory">Backstory</span><div class="tl-title">Orin's Backstory</div><div class="tl-reveal known">Known to players</div><p>The library discovery, a few months before Billy's invitation.</p></div></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"></div><div></div>
    <div class="tl-right"><div class="tl-box size-minor"><span class="tl-cat backstory">Backstory</span><div class="tl-title">The Invitation</div><div class="tl-reveal known">Known to players</div><p>Billy finds the old invitation, then a second unsigned one. Sets sail. (Orchestrated by "Mr. Colors" — not yet explored in-fiction.)</p></div></div>
  </div>

  <div class="tl-time-note">⏱ ~37 inner-boundary years pass here in only ~2–3 wider-world months — this is why Tide's aged from 6 to his 40s by the time Billy finds him.</div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-major"><span class="tl-cat milestone">Milestone</span><div class="tl-title">Boarding the Ship</div><div class="tl-date">Aug 27, Year 298 IBC — Day 1</div><div class="tl-reveal known">Known to players</div><p>~37 IB years after the recapture. Billy meets Biggie and Mercy; Orin recruited soon after. Everything since has taken 6 IB days total.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat session">Session Event</span><div class="tl-title">General Guy</div><div class="tl-date">Aug 27, Year 298 IBC — Day 1</div><p>First real fight. Jade chain blades taken.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat session">Session Event</span><div class="tl-title">Meeting Jacklyn</div><div class="tl-date">Aug 27, Year 298 IBC — Day 1</div><p></p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat session">Session Event</span><div class="tl-title">the Bells End</div><div class="tl-date">Aug 27, Year 298 IBC — Day 1</div><p>Fruit Man, bartender deal for Allistar Ratsilla.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box"><span class="tl-cat session">Session Event</span><div class="tl-title">The Sea Witch Freed</div><div class="tl-date">Aug 28, Year 298 IBC — Day 2</div><p>Blessing given; crew agrees to help undo the pirates' prophecy. Turns them quietly against the prophecy and the pirates chasing it.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box"><span class="tl-cat session">Session Event</span><div class="tl-title">Crabshack Isle</div><div class="tl-date">Aug 28–30, Year 298 IBC — Day 2–4</div><p>Meets Tide (gives Billy the shield), learns of Snarlywinkle's siege, meets Shipoo at the lighthouse. Tide's now been with Snarlywinkle ~4 IB years. Killed and impersonated the town mayor for information, beating Snarlywinkle to his own siege.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-major"><span class="tl-cat milestone">Milestone — Kids Taken</span><div class="tl-title">Southern Navy Stronghold</div><div class="tl-date">Aug 31, Year 298 IBC — Day 5</div><p>Soul Room found and woken (mass casualty stampede). Amulet taken — found glowing near the Soul Room. Tide taken again; the Warden wipes memories of the kids from everyone but Orin and Cheese/Wine; Billy keeps his memory of Tide.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat session">Session Event</span><div class="tl-title">Now — Chapter 1 Epilogue</div><div class="tl-date">Sep 1, Year 298 IBC — Day 6, present day</div><p>Journey toward the crow's nest begins.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box"><span class="tl-cat session">Session Event</span><div class="tl-title">Evading the Navy</div><div class="tl-date">Sep 1, Year 298 IBC — Day 6 (cont.)</div><p>Party evaded the pursuing navy ship. Orin was shot out of the sky mid-escape — something unknown then dragged him out of the water — identity still unknown. Willow will wait for the party at Crabshack and start telling the Crabshack pirates about the amulet and the party.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box"><span class="tl-cat session">Session Event</span><div class="tl-title">No Man's Land — Arrival</div><div class="tl-date">Sep 1, Year 298 IBC — Day 6 (cont.)</div><p>Party agreed to join Willow Heart once they get the kids back, then entered No Man's Land. Found a dead man holding a note, and a house with information hidden beneath it. Party split up: some waiting in town, Billy, Cheese n Wine, and Mercy searching the forest. See <span class="xref" onclick="return jumpTo('boundary-nomansland','No Man\'s Land')">No Man's Land</span> reference page.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box"><span class="tl-cat session">Session Event</span><div class="tl-title">The Amulet's Inscription</div><div class="tl-date">Sep 1, Year 298 IBC — Day 6 (cont.)</div><p>Party read the inscription running around the amulet's edge — it points to Richman's Rock.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat session">Session Event</span><div class="tl-title">Willow &amp; Shipoo's Odd Reunion</div><div class="tl-date">Sep 1, Year 298 IBC — Day 6 (cont.)</div><p>The two met and briefly discussed Tide before immediately forgetting he existed — then repeated the exact same conversation minus the Tide part. Also discussed the Flip, saying it's coming up soon.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box size-minor"><span class="tl-cat session">Session Event</span><div class="tl-title">Orin &amp; Judy</div><div class="tl-date">Sep 1, Year 298 IBC — Day 6 (cont.)</div><p>Orin pushed way too hard trying to get Judy to turn invisible, scaring her badly.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-time-note">⏱ Right now, inner-boundary time is running only ~1.4x faster than the wider world — close to the closest these two clocks have ever run.</div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box planned size-minor"><span class="tl-cat future">Planned</span><div class="tl-title">Snarlywinkle Confrontation</div><p>Unplanned encounter crossing his ship on the way out of the stronghold — he doesn't yet know about the heist or the mayor.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box planned"><span class="tl-cat future">Planned</span><div class="tl-title">No Man's Land — Deeper</div><p>Party still investigating: eerily quiet tavern, empty buildings, a creepy basement with a frog skeleton. Siren figure "Mother" has invited them to dinner — they don't trust her. Bullywug hats and the tower-of-charmed-people reveal still ahead — see <span class="xref" onclick="return jumpTo('boundary-nomansland','No Man\'s Land')">the No Man's Land</span> reference page.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>
  <div class="tl-row">
    <div class="tl-left"><div class="tl-box planned size-minor"><span class="tl-cat future">Planned — Time Skip</span><div class="tl-title">Leaving No Man's Land</div><p>~1 week to pass in-game once the party leaves. Read a one-line time-skip cue at the table rather than narrating it day by day.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>
  <div class="tl-row">
    <div class="tl-left"><div class="tl-box planned size-minor"><span class="tl-cat future">Planned — Time Skip</span><div class="tl-title">Journey to the Crow's Nest</div><p>Defaults to ~5 days in-game; flexible up to a week if more real-world pacing room is needed before the Coronation.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>
  <div class="tl-row">
    <div class="tl-left"><div class="tl-box planned"><span class="tl-cat future">Planned</span><div class="tl-title">The Crow's Nest / Coronation</div><p>Party heads here believing the Coronation — and their best shot at the kids — is here. King's identity revealed at the Coronation.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"></div><div></div>
    <div class="tl-right"><div class="tl-box planned size-minor"><span class="tl-cat future">Planned</span><div class="tl-title">(space for wider-world beats as they come up)</div><p></p></div></div>
  </div>

  <div class="tl-row">
    <div class="tl-left"><div class="tl-box planned size-major"><span class="tl-cat future">Planned</span><div class="tl-title">Campaign Endgame</div><p>Find and stop the trapped prophecy captain's ritual (needs 8 people). Howard, Jacklyn, Aric, and the Coronation all expected to converge here — exact shape still forming.</p></div></div>
    <div></div><div class="tl-right"></div>
  </div>

  <div class="tl-flip"><div class="tl-flip-marker">⟡ THE FLIP — parity crossover, expected around/after the Crow's Nest ⟡</div></div>

  <div class="tl-time-note">⏱ Past this point, inner-boundary time starts running slower than the wider world for the first time ever — and keeps falling further behind the longer it goes on.</div>

</div>
` },


    { id:'artifacts', num:'Chapter VIII', title:'Artifacts', type:'html', content:`<p>Tap one for the full rundown.</p>
<div class="hub-grid">
  <a href="#" class="hub-card" onclick="showView('artifact-amulet');return false;"><div class="hc-name">The Amulet</div></a>
  <a href="#" class="hub-card" onclick="showView('artifact-chainblades');return false;"><div class="hc-name">Jade Chain Blades</div><div class="hc-sub">Orin</div></a>
  <a href="#" class="hub-card" onclick="showView('artifact-shield');return false;"><div class="hc-name">Sentient Shield</div><div class="hc-sub">Billy — "Shield of Promise"</div></a>
  <a href="#" class="hub-card" onclick="showView('artifact-blockers');return false;"><div class="hc-name">Arcane Energy Blockers</div></a>
</div>` },

    { id:'artifact-amulet', num:'Reference', title:'The Amulet', sub:true, type:'html', content:`<div class="info-block"><ul><li>A purple crystal amulet, shaped like a small coffin, with an inscription running around its edge</li><li>Can remove a soul from a body</li><li>Can preserve the physical body while the soul is trapped elsewhere (very difficult for the wearer)</li><li>Currently: lets the wearer summon undead creatures</li><li>Found glowing near the Soul Room during the stronghold heist — this is the amulet Marilda originally found; Aric used it to rise to power</li><li>Inscription reads: directions to <strong>Richman's Rock</strong> — read by the party in No Man's Land</li><li>Currently held by Billy</li></ul></div>` },

    { id:'artifact-chainblades', num:'Reference', title:'Jade Chain Blades', sub:true, type:'html', content:`<div class="info-block"><p>Taken from General Gai after his defeat in the Session 1 boat battle. Evolving weapon that grows alongside the character; can trap the souls of slain creatures as Jade Stones. Full leveled progression lives in the Player Bible.</p></div>` },

    { id:'artifact-shield', num:'Reference', title:'Sentient Shield ("Shield of Promise")', sub:true, type:'html', content:`<div class="info-block"><p>Given to Billy by Tide at Crabshack, who said it belonged to Marilda. Has its own personality and agency — makes and holds <strong>promises</strong> with roleplay and mechanical consequences. Not yet triggered. Full leveled progression lives in the Player Bible.</p></div>` },

    { id:'artifact-blockers', num:'Reference', title:'Arcane Energy Blockers', sub:true, type:'html', content:`<div class="info-block"><p>An item you place on a magic item to block its arcane energy — suppresses whatever it does. Purchased from Major Plot Twist, a wizard in Crabshack's Arcane District.</p></div>` },

    { id:'partygoals', num:'Chapter IX', title:'Party Goals', type:'html', content:`<div class="info-block"><div class="info-name">Reach the Crow's Nest</div><p>Before the Coronation happens.</p></div>
<div class="info-block"><div class="info-name">Rescue the Kids &amp; Wine</div><p>Taken by Aric during the stronghold heist.</p></div>
<div class="info-block"><div class="info-name">Figure Out Aric's Motive</div><p>He wants Tide — the party doesn't fully know why yet.</p></div>
<div class="info-block"><div class="info-name">Help the Sea Witches</div><p>Undo the pirates' prophecy.</p></div>
<div class="info-block"><div class="info-name">Figure Out What's Going On in No Man's Land</div><p>An eerily quiet tavern and empty buildings. A creepy basement with a frog skeleton. Mother — clearly unsettling — has invited them to dinner, but they don't trust her.</p></div>
<div class="info-block"><div class="info-name">Endgame</div><p>Stop the trapped prophecy captain's ritual — see <span class="xref" onclick="return jumpTo('story','act 1 — in progress')">Story</span>.</p></div>
<div class="info-block"><div class="info-name">Ship &amp; Finances (quick status)</div><p>Big Daddy destroyed during the stronghold escape. Currently on a replacement vessel, not yet named. Penniless — lost their gold with the Big Daddy. Recurring captain's dream: Heart of the Sea, a portal, a dagger that functions as a key — tied to returning to Howard.</p></div>` },

    { id:'mysteries', num:'Chapter X', title:'Mysteries', type:'html', content:`<p>Everything below is DM knowledge the players do not currently have. Check before every session so nothing slips out early.</p>
<div class="secret"><p><strong>Tide = Allistar.</strong> Aric named him Allistar; Billy and the party know him as Tide. Not yet connected by the players. This is intentional slow-burn foreshadowing — keep dropping the name.</p></div>
<div class="secret"><p><strong>Aric's projection ability.</strong> His real body is in the capital. Every Warden encountered at every stronghold has been a projection. Not yet revealed.</p></div>
<div class="secret"><p><strong>The trapped prophecy captain.</strong> The original captain who found the arcane energy source needs eight people to perform the ritual to escape — this is why he's stuck, and why he's been quietly pulling strings (including sending Marilda on her original voyage) ever since.</p></div>
<div class="secret"><p><strong>The Howard conspiracy line.</strong> Aric referenced it aloud during the Warden fight; almost certainly missed by the table. Needs deliberate resurfacing.</p></div>
<div class="secret"><p><strong>Biggie Wiggie</strong> is triple-agenting the Navy, the pirates, and the party. True alignment undecided — keep the party trusting him until the Crow's Nest reveal.</p></div>
<div class="secret"><p><strong>Marilda's status</strong> with Aric — willing acceptance vs. pure coercion — not yet decided by the DM. Keep ambiguous until it matters.</p></div>
<div class="secret"><p><strong>The purple glow</strong> shared by Billy, Tide, and Aric is unexplained even to the DM — a thread to define before it's paid off.</p></div>
<div class="secret"><p><strong>Poo</strong> hasn't been met by the party yet — an 11-year-old, kidnapped by Snarlywinkle, escaped, now trained by Jacklyn as a "chosen one." Plan for a future introduction.</p></div>
<div class="secret"><p><strong>The Crabshack mayor impersonation</strong> is an open thread — the party killed and impersonated the town mayor for information. Currently paused since they're away from Crabshack and penniless; could resurface if they return, or unravel when they next cross Snarlywinkle (who doesn't yet know about the heist or the impersonation).</p></div>
<div class="secret"><p><strong>The fisherman's sister died</strong> during the heist, in front of him — he knows, and is likely heading toward a revenge arc. Good candidate for a recurring NPC.</p></div>
<div class="secret"><p><strong>Mother's origin.</strong> Full backstory now written up on her own <span class="xref" onclick="return jumpTo('npcs','mother')">NPC page</span> — grew up happy on Crabshack, snuck off with pirates, washed up alone on the island, and slowly broke down in isolation over years, gaining power from the island as her sanity eroded. First surfaces as fragments in the No Man's Land forest tree hollow (toy + increasingly dark drawings), then room by room through the tower descent. Party should be left to theorize, never told directly. Not in the Player Bible even in disguised form.</p></div>` },

    { id:'improv', num:'Chapter XI', title:'Quick Reference & Improv Toolkit', type:'html', content:`<p><em>Things to throw in if the players go off course — reminders, NPC voices, fallback hooks.</em></p>
<h3>Fallback hooks</h3><div class="info-block"><ul><li>The fisherman (sister died in the heist) — vengeance-driven, could resurface anywhere</li><li>Snarlywinkle's ship, on the way out of the stronghold — he's suspicious but doesn't yet know about the heist or the mayor impersonation</li><li>Judy following invisibly — can be used to feed the party info they "shouldn't" have yet</li></ul></div>
<h3>NPC voice/quirk reminders</h3><div class="info-block"><ul><li>Jeoph McGullywuff — tries to sound tough ("Bloodboiler"), constantly breaks into a sappy, anxious teenager</li><li>Sloth (Crabshack tavern bartender) — comically slow-talking, slow-moving</li><li>Jacklyn — insecure, self-conscious about her ex, oddly sweet</li></ul></div>
<h3>Standing reminders</h3><div class="info-block"><ul><li>Aric wants Tide, motive still secret</li><li>Biggie Wiggie's true loyalty is undecided — don't tip it early</li><li>Poo hasn't been introduced yet — hold for the right moment</li><li>Teleportation magic was wiped out by the sea witches — Biggie can cast Misty Step, so NPCs may react oddly/suspiciously if they see it used</li></ul></div>` },

<div class="info-block"><ul>

    { id:'log', num:'Chapter XIV', title:'Session Log', type:'log', entries:[
      { date:'Sessions so far (summary)', text:`Party defeated General Gai in a boat battle, taking his Jade Chain Blades (now Orin's). Met Jacklyn briefly; party believes they can call on her for help but have only tested this once. Visited Bells End (Bing &amp; Bong, the barkeep's Allistar Ratsilla bounty). Arrived at Crabshack, met Tide for the first time. Snarlywinkle asked the party to help plan a siege on the amulet — instead they sabotaged his reputation (fake wall postings), killed and impersonated the town mayor for information, recruited Froth (ex-prisoner) and Chef Nathan, met Sloth the bartender, robbed several houses (Biggie), bought arcane energy blockers from Major Plot Twist in the Arcane District, and met Shipoo in the lighthouse. Promised the fisherman they'd save his sister.<br><br>Snuck onto a navy ship, infiltrated the warehouse, killed a Goliath, discovered the Soul Room, solved an arcane security puzzle, saw Tide glow purple. Raided the medbay for the Warden's medicine. Confronted the Warden — fight went as planned. Aric wiped party memories of Orin's kids (except Orin and Cheese/Wine); Billy kept his memory of Tide. Aric took Marilda's chained form as leverage, then took Tide and Wine at the end of the fight.<br><br>Escaping, the party checked the Soul Room for the kids (not there) and accidentally triggered a mass-casualty stampede among the waking soulless bodies. Fled the Navy, left survivors behind. A misfired cannon (from earlier) crashed their ship, the Big Daddy, into the stronghold — kids weren't aboard, but the ship and their gold were lost. Escaped on a different boat. Revealed: Judy had been invisible and following them the whole time — possibly why Aric never took her (see invisibility). The fisherman's sister died during the heist, in front of him.<br><br>Current status: penniless, down a ship, heading toward a probable encounter with Snarlywinkle on the way out, then on to the Crow's Nest.` }
    ] },

    { id:'session-plan', num:'Session Prep', title:'Session Plan', sessionPlan:true, type:'html', content:`<p style="font-size:13px;color:#6b5a3a;font-style:italic;margin:0 0 10px;">Tuesday Session — No Man's Land, forest scene next. Chronological, scene by scene. Only unplayed content lives here — once a beat actually happens at the table, it's wiped from this page (captured instead in the Master Timeline/Story/Mysteries chapters) and new prep gets slotted in before or after whatever's left, wherever it fits the story. Use the "NPCs" button (top right, follows you as you scroll) to jump to anyone out of order.</p>

<div class="beat-box" style="border-color:#7a1414;"><span class="bb-label">🔒 Session Tools — Player Bible Secret Knowledge Passwords (DM eyes only)</span><ul>
  <li>Billy: <strong>bigtrout</strong></li>
  <li>Orin: <strong>persephoneisbae</strong></li>
  <li>Cheese n Wine: <strong>brieandmerlot</strong></li>
  <li>Case-insensitive on the Player Bible unlock fields; re-locks on every page refresh</li>
</ul></div>

<div class="beat-box" style="border-color:#3d6b3d;"><span class="bb-label">Since last session — quick recap (read at the table)</span><ul>
  <li>Evaded a navy ship — Orin was shot from the sky and pulled from the water by something unknown</li>
  <li>Chased and boarded by Willowheart's crew; fight ended when Shipoo revealed herself and appealed to their shared goal of finding Poo — Willowheart submitted</li>
  <li>Entered No Man's Land, found a dead man in the tavern holding a note, tracked it to a house with a hidden basement</li>
  <li>Basement held a frog skeleton and a stash of bullywug hats — party took the hats (advantage on Wisdom saves)</li>
  <li>Mother invited the party to dinner that evening — they're distrustful</li>
  <li>Read the amulet inscription — points to Richman's Rock. Billy's holding the amulet</li>
  <li>Willow and Shipoo had a looping conversation where they both forgot Tide exists</li>
  <li>Talk of an upcoming event called "the Flip"</li>
</ul></div>

<div class="beat-box" style="border-color:#7a1414;"><span class="bb-label">Before the scene starts — Sentient Shield</span><ul>
  <li>The promise mechanic hasn't triggered yet. Flag it to Tristan directly at the top of the session so it's actually in play.</li>
</ul></div>

<div class="beat-box"><span class="bb-label">Fun fact — Mother-themed</span><ul>
  <li>[Will's prompt goes here]</li>
</ul></div>


<div class="scene-block">
  <div class="scene-title">Scene 3 — Resupply &amp; the Journey to the Crow's Nest</div>
  <div class="setup-box"><span class="sb-label">Setting the scene</span>Mostly roleplay/logistics, low on mechanics. Party works out supplies and plans the route with the crew — likely heavy chat with Jezebel &amp; Saquiphony, and Willowheart if she's tagging along (may be roped into grabbing food from her old ship).</div>

  <div class="beat-box"><span class="bb-label">The journey</span><ul>
    <li>Roughly a 4-5 day sail to the <span class="xref" onclick="return jumpTo('boundary-crowsnest','the crow\'s nest')">Crow's Nest</span></li>
    <li>On the way, the party passes <span class="xref" onclick="return jumpTo('boundary-nomansland','No Man\'s Land')">No Man's Land</span> — a premonition of something each of them desires draws them toward it; entirely the party's choice whether to stop and investigate</li>
    <li>Puzzle photos from the previous run still need uploading to Discord/D&amp;D Beyond before this comes up</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Somewhere along this stretch — the Milfs</span><ul>
    <li>A rival ship, sails marked with a big letter "M," catches up to the party at sea</li>
    <li>Party will likely try to avoid/outrun them first — that's fine, they catch up regardless</li>
    <li>Not a fight unless the party makes it one — plays as a loud group entrance, then a string of private one-on-one "chats" pulling different party members aside</li>
  </ul></div>

  <div class="npc-quote"><span class="npc-quote-label">The moment the ship's within earshot — Orin's mum</span>"Well, would you look who decided to embarrass an entire species. Hello, sweetheart, you're grounded, get in the ship."</div>

  <div class="npc-chip-row">
    <button class="npc-chip" onclick="return toggleCard('sp-milfsleader')">Cheese n Wine's Mother<span class="chip-sub">leader — placeholder</span></button>
    <button class="npc-chip" onclick="return toggleCard('sp-orinsmom')">Orin's Mother<span class="chip-sub">unnamed</span></button>
    <button class="npc-chip" onclick="return toggleCard('sp-julie')">Julie the Joy Rider<span class="chip-sub">Judy's mother</span></button>
    <button class="npc-chip" onclick="return toggleCard('sp-gertrude')">Gertrude<span class="chip-sub">Persephone's mother</span></button>
    <button class="npc-chip" onclick="return toggleCard('sp-billysmom')">Billy's Mother<span class="chip-sub">unnamed</span></button>
    <button class="npc-chip" onclick="return toggleCard('sp-crystalkitty')">Crystal &amp; Kitty<span class="chip-sub">Biggie's ex-wives</span></button>
  </div>

  <div class="npc-card" id="sp-milfsleader">
    <div class="card-name">Cheese n Wine's Mother <span class="tag">leader — placeholder</span></div>
    <div class="fact"><span class="fact-label">Who</span>Leads the Milfs' crew, driving them to reach the Crow's Nest first. Confirmed by Matt: the only woman in Cheese n Wine's life. Personality, voice, and appearance still pending — placeholder until that comes in.</div>
    <div class="npc-ddb-note">Homebrew — nothing built in D&amp;D Beyond yet, waiting on Matt</div>
  </div>

  <div class="npc-card" id="sp-orinsmom">
    <div class="card-name">Orin's Mother <span class="tag">new</span></div>
    <div class="fact"><span class="fact-label">Who</span>Aarakocra, like Orin. Frumpy blue denim dress with a pirate hat jammed on top. Wacky, outlandish, casually racist about other species without registering it as a problem — genuinely believes she's the most important person in any room.</div>
    <div class="fact"><span class="fact-label">Real motivation</span>Not fear for Orin's safety — pure embarrassment. He's humiliated her in front of her whole community. Frames it directly as "you've made your family/species look bad," zero pretense about real concern.</div>
    <div class="npc-quote"><span class="npc-quote-label">Opening line</span>"Well, would you look who decided to embarrass an entire species. Hello, sweetheart, you're grounded, get in the ship."</div>
    <div class="npc-ddb-note">New — add D&amp;D Beyond sheet if needed</div>
  </div>

  <div class="npc-card" id="sp-julie">
    <div class="card-name">Julie the Joy Rider <span class="tag">new</span></div>
    <div class="fact"><span class="fact-label">Who</span>Aarakocra, Judy's biological mother — under Orin's culture's anonymous-procreation customs, women choose the father and the man never learns who the mother was. Self-aware about how messed up that is; warm, reasonable, a little wistful. Genuinely open to co-parenting Judy with Orin if he's willing.</div>
    <div class="fact"><span class="fact-label">Looks</span>Objectively unattractive by outside standards — the pinnacle of beauty by aarakocra standards. Good beat: the rest of the party is baffled why Orin's smitten.</div>
    <div class="fact"><span class="fact-label">Play</span>A genuine romantic complication for Orin, not just custody drama — a second interest to juggle alongside Jacklyn. Stays quiet during the group's loud entrance, then privately asks Orin for a one-on-one chat afterward.</div>
    <div class="npc-ddb-note">New — add D&amp;D Beyond sheet if needed</div>
  </div>

  <div class="npc-card" id="sp-gertrude">
    <div class="card-name">Gertrude <span class="tag">new</span></div>
    <div class="fact"><span class="fact-label">Who</span>Persephone's biological mother — huge, in a dress, speaks in simple caveman-style sentences. Zero respect for personal boundaries, even more casually offensive than Orin's mum. Immediately physical: grabs Orin, sits on him, gets right in his face without negotiating.</div>
    <div class="fact"><span class="fact-label">The gag</span>Persephone's mannerisms read as cute coming from her. The exact same behavior from Gertrude, at her size, is horrifying. Play her as a running physical nuisance across the whole encounter — something Orin's actively trying to shake off.</div>
    <div class="npc-ddb-note">New — add D&amp;D Beyond sheet if needed</div>
  </div>

  <div class="npc-card" id="sp-billysmom">
    <div class="card-name">Billy's Mother <span class="tag">new — placeholder name</span></div>
    <div class="fact"><span class="fact-label">Who</span>The one sincere, grounded voice on this ship — everyone else plays for chaos/comedy, she's genuinely there because she loves Billy and wants to check he's okay. Not the leader — not trying to run anything, just support her son.</div>
    <div class="fact"><span class="fact-label">What she knows</span>Completely in the dark — no idea about Marilda, Tide, or Aric. Just a mother worried sick about her son. Good candidate for a quiet, poignant one-on-one rather than a comedic beat.</div>
    <div class="npc-ddb-note">New — add D&amp;D Beyond sheet if needed</div>
  </div>

  <div class="npc-card" id="sp-crystalkitty">
    <div class="card-name">Crystal &amp; Kitty <span class="tag">new — duo</span></div>
    <div class="fact"><span class="fact-label">Who</span>Biggie Wiggie's two ex-wives, riding along as a pair — entitled, spoiled, convinced the party will just hand Biggie over (and their divorce money with him) the moment they show up. Comic-relief pressure on top of the mothers' more emotional drama. No signature lines locked yet.</div>
    <div class="npc-ddb-note">New — add D&amp;D Beyond sheet(s) if needed</div>
  </div>

  <div class="npc-chip-row">
    <button class="npc-chip" onclick="return toggleCard('sp-nomansland-detail')">No Man's Land — full plan<span class="chip-sub">tap to expand</span></button>
  </div>

  <div class="npc-card" id="sp-nomansland-detail">

      <li>Party greeted right on the dock by <strong>Mother</strong> — warm, welcoming: "Welcome to my home. I hope you'll make yourselves comfortable. You're completely welcome."</li>
      <li>Invites them to dinner that evening at her tower to "get them settled in" and "become part of the family"</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">The town — surface illusion</span><ul>
      <li>~20 houses, but most are empty — only reads as lived-in/bustling at a glance</li>
      <li>Shopping options available</li>
      <li>Tavern: patrons gambling, drinking, cards — but bartenders/staff are spirits compelled to serve, going through the motions with nothing real to pour. Unresponsive, mechanically competent</li>
      <li>None of it is real — the whole town is Mother's illusion (payoff below)</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">The dead man &amp; the note (tavern)</span><ul>
      <li>Mysterious figure in the tavern corner — actually dead, holding a note</li>
      <li>Was a member of the original prophecy captain's first crew, searching for him after losing track of him</li>

      <li>Contains: the dead man's full notes on Mother and the original captain; a stash of bullywug hats; a chained-up bullywug skeleton</li>

      <div class="full-desc"><span class="fd-label">Full description — read aloud if wanted</span>A nice, grand study. A big desk sits under portraits that seem to watch a little too closely — if anyone looks hard, they'd swear one of them just breathed. A fire's going, and the tea on the desk is still steaming, though nothing about this room feels like anyone's touched it in a while. Across the room, set into the wall, is a single enormous mouth beside a single enormous eye. It isn't speaking. It's just watching you.</div>

        <li>Mouths only make everyday small talk / comfort chatter</li>
        <li><strong>Puzzle — the 26 Voice Stones:</strong> Shipoo (well-read) can identify what they are if asked. Undisclosed rule: each word spoken to a stone must follow the next unused letter of the alphabet, A–Z, across the whole party's attempts collectively — not per player. All 26 lit unlocks the door</li>
        <li><strong>Stones #11, #16, #22, #24</strong> — four books on the floor, each calls out to the party; succeed an Arcana check on a book to reveal its number</li>
        <li><strong>Stone #14</strong> — carved on a green book</li>
        <li><strong>Stones #17, #23</strong> — badges on the two guardian suits of armor (truth-teller/liar riddle pair)</li>

      <div class="full-desc"><span class="fd-label">Full description — read aloud if wanted</span>A bedroom, a little nicer than what's below. The duvet on the bed catches the light strangely — looking straight at it makes your eyes want to slide away. Every shelf is stacked with ordinary-looking books, and tucked into each one is a small mouth, murmuring pleasant nothings to itself. A faint shimmer of gemstones catches the light along the walls — twenty-six of them, each set above its own quiet, muttering mouth.</div>

      <div class="full-desc"><span class="fd-label">Full description — read aloud if wanted</span>A rough, bare cave. On the floor, an old animal-skin blanket, worn thin. Pinned to the walls, dozens of drawings — the same story, told again and again, each version scratched out and redrawn a little more furiously than the last. Two doors sit side by side, each fitted with a mouth carved to resemble the same woman's face, waiting to speak.</div>

  <div class="scene-title">Scene 5 — District 1, Day One (vibe: the movie "Holes")</div>
  <div class="setup-box"><span class="sb-label">Setting the scene</span>Grim, grinding poverty-tier logistics — a bunkhouse, a work shift, a monster in the sewers. The wage math isn't rigged on paper; it's the environment around it that's rigged. Play it straight and let the numbers speak for themselves.</div>

  <div class="beat-box"><span class="bb-label">Housing</span><ul>
    <li>Mandatory shared bunkhouse (40-50 people) since they're broke</li>
    <li>Must work 5-6 hours/day minimum (splittable across the week) just to keep the housing</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">The economy — do the math openly</span><ul>
    <li>Wage: 8gp/hour. A full 8-hour day = 64gp</li>
    <li>Baseline living costs (bunk + food): 30gp/day</li>
    <li>Net savings: ~34gp/day, best case</li>
    <li>Buy-in to move up to District 2: 8,000-10,000gp — near-impossible, roughly 7-10 months even at a perfect grind</li>
  </ul></div>

  <div class="npc-quote"><span class="npc-quote-label">Secret — the real mechanic</span>The wage math isn't rigged on paper — the environment is. The city plants scammers, conmen, and fake criminals to bleed residents' savings via believable in-fiction events. <strong>Not for this Tuesday specifically</strong> — reserved: whenever the party gets genuinely close to hitting their buy-in target, spring a last-minute expensive catastrophe (e.g. a medical bill) that wipes out most of their savings. Hold this for maximum impact later, don't spend it early.</div>

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function applyEditability(){
  document.querySelectorAll('.content[contenteditable], .chapter-title[contenteditable], .check-text[contenteditable], td[contenteditable]').forEach(el => {
    el.contentEditable = sessionView ? 'false' : 'true';
  });
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    data = res && res.value ? JSON.parse(res.value) : deepClone(DEFAULT_DATA);
  }catch(e){ data = deepClone(DEFAULT_DATA); }
  if(!data.trialScores) data.trialScores = { defense: 0, prosecution: 0 };
  render();
  setSaveStatus('saved');
}

// Trial scoreboard — +1 buttons for defense/prosecution, persists via the same
// storage as everything else. Updates the number directly rather than a full
// render() so it stays snappy mid-session.
function adjustTrialScore(side, delta){
  if(!data.trialScores) data.trialScores = { defense: 0, prosecution: 0 };
  data.trialScores[side] = Math.max(0, (data.trialScores[side] || 0) + delta);
  const el = document.getElementById('trial-score-' + side);
  if(el) el.textContent = data.trialScores[side];
  scheduleSave();
  return false;
}
function setSaveStatus(state){
  const bar = document.getElementById('savebar');
  const label = document.getElementById('saveLabel');
  if(state==='saving'){ bar.classList.remove('saved'); label.textContent='Saving…'; }
  else if(state==='saved'){ bar.classList.add('saved'); label.textContent='All changes saved'; }
  else { bar.classList.remove('saved'); label.textContent='Loading…'; }
}
function scheduleSave(){
  setSaveStatus('saving');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(data)); setSaveStatus('saved'); }
    catch(e){ console.error('Save failed', e); }
  }, 500);
}

function slugify(text){
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function toggleNpcPanel(){
  const panel = document.getElementById('spNpcPanel');
  const overlay = document.getElementById('spNpcPanelOverlay');
  if(panel) panel.classList.toggle('open');
  if(overlay) overlay.classList.toggle('open');
}

function injectSpNpcPanel(){
  if(document.getElementById('spNpcPanelToggle')) return; // already present
  const wrap = document.createElement('div');
  wrap.id = 'spNpcPanelWrap';
  wrap.innerHTML = SP_NPC_PANEL_HTML;
  document.body.appendChild(wrap);
  document.getElementById('spNpcPanelToggle').addEventListener('click', toggleNpcPanel);
  document.getElementById('spNpcPanelClose').addEventListener('click', toggleNpcPanel);
  document.getElementById('spNpcPanelOverlay').addEventListener('click', toggleNpcPanel);
}

function removeSpNpcPanel(){
  const wrap = document.getElementById('spNpcPanelWrap');
  if(wrap) wrap.remove();
}

// Cross-reference jump: switch chapters, then scroll to the specific h3
// heading whose text matches `anchorText` (case-insensitive, slugified).
function jumpTo(viewId, anchorText){
  showView(viewId);
  setTimeout(() => {
    const id = slugify(anchorText);
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
  return false;
}

function showCalMonth(month, btn){
  document.querySelectorAll('.calendar-month').forEach(m => m.classList.remove('active'));
  document.getElementById('cal-' + month).classList.add('active');
  document.querySelectorAll('.calendar-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

function showView(viewId, isBack){
  if(!isBack && currentView && currentView !== viewId){
    viewHistory.push(currentView);
  }
  currentView = viewId;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById('view-' + viewId);
  if(target) target.classList.add('active');
  document.querySelectorAll('#sidebarNav a').forEach(a => a.classList.remove('active'));
  const navLink = document.querySelector('#sidebarNav a[data-view="' + viewId + '"]');
  if(navLink) navLink.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  if(viewId === 'session-plan'){ injectSpNpcPanel(); } else { removeSpNpcPanel(); }
  window.scrollTo(0,0);
}

function goBack(){
  if(!viewHistory.length) return;
  const prev = viewHistory.pop();
  showView(prev, true);
}

function renderSidebar(){
  const nav = document.getElementById('sidebarNav');

  glossaryLink.addEventListener('click', e => { e.preventDefault(); showView('glossary'); });
  nav.appendChild(glossaryLink);
  const hr = document.createElement('hr'); hr.className = 'divider-line';
  nav.appendChild(hr);
  data.chapters.filter(ch => !ch.sub && !ch.sessionPlan).forEach(ch => {
    const a = document.createElement('a');
    a.href = '#'; a.dataset.view = ch.id; a.textContent = ch.title;
    a.addEventListener('click', e => { e.preventDefault(); showView(ch.id); });
    nav.appendChild(a);
  });
  const spChapter = data.chapters.find(ch => ch.sessionPlan);
  if(spChapter){
    const spBtn = document.createElement('a');
    spBtn.href = '#'; spBtn.dataset.view = spChapter.id; spBtn.className = 'session-plan-nav-btn';
    spBtn.textContent = spChapter.title;
    spBtn.addEventListener('click', e => { e.preventDefault(); showView(spChapter.id); });
    nav.appendChild(spBtn);
  }
  const active = document.querySelector('#sidebarNav a[data-view="' + currentView + '"]');
  if(active) active.classList.add('active');
}

function renderGlossaryView(){
  const wrap = document.createElement('section');
  wrap.className = 'view'; wrap.id = 'view-glossary';

  head.className = 'view-head';
  head.innerHTML = `<div class="eyebrow">Quick Index</div><h1>Glossary</h1>`;

  note.style.fontSize = '14px'; note.style.color = '#6b5a3a'; note.style.fontStyle = 'italic';
  note.textContent = 'Every top-level chapter, one tap away. Sub-pages (individual NPCs, islands, players, artifacts) live inside their hub chapter, or find them with search.';
  wrap.appendChild(note);
  const grid = document.createElement('div');
  grid.className = 'glossary-grid';
  data.chapters.filter(ch => !ch.sub && !ch.sessionPlan).forEach(ch => {
    const a = document.createElement('a');
    a.href = '#'; a.className = 'glossary-card';
    a.innerHTML = `<div class="gnum">${ch.num}</div><div class="gtitle">${ch.title}</div>`;
    a.addEventListener('click', e => { e.preventDefault(); showView(ch.id); });
    grid.appendChild(a);
  });
  wrap.appendChild(grid);
  const addBtn = document.createElement('button');
  addBtn.className = 'add-chapter-inline';
  addBtn.textContent = '+ Add a new chapter';
  addBtn.addEventListener('click', addChapter);
  wrap.appendChild(addBtn);
  return wrap;
}

function render(){
  const container = document.getElementById('views');
  container.innerHTML = '';
  container.appendChild(renderGlossaryView());

  data.chapters.forEach((ch) => {
    const el = document.createElement('section');
    el.className = 'view';
    el.id = 'view-' + ch.id;
    const head = document.createElement('div');
    head.className = 'view-head';
    head.innerHTML = `<div class="eyebrow">${ch.sub ? 'Reference' : ch.num}</div><h1 class="chapter-title" contenteditable="true">${ch.title}</h1>`;
    el.appendChild(head);
    head.querySelector('.chapter-title').addEventListener('input', e => { ch.title = e.target.innerText; renderSidebar(); scheduleSave(); });

    const actions = document.createElement('div');
    actions.className = 'chapter-actions';
    actions.innerHTML = `<button data-action="delete">Delete Chapter</button>`;
    actions.querySelector('[data-action="delete"]').addEventListener('click', () => {
      if(confirm(`Delete "${ch.title}"?`)){ data.chapters = data.chapters.filter(c => c.id !== ch.id); showView('glossary'); render(); scheduleSave(); }
    });
    el.appendChild(actions);

    if(ch.type === 'html'){
      const content = document.createElement('div');
      content.className = 'content'; content.contentEditable = 'true'; content.innerHTML = ch.content;
      content.querySelectorAll('h3').forEach(h => {
        if(!h.id) h.id = slugify(h.textContent);
      });
      content.addEventListener('input', () => { ch.content = content.innerHTML; scheduleSave(); });
      el.appendChild(content);
    }

    if(ch.type === 'ddb'){
      const note = document.createElement('p');
      note.style.fontSize = '13px'; note.style.fontStyle = 'italic'; note.style.color = '#6b5a3a';
      note.textContent = 'Full stat blocks and initiative live in D\u2019D Beyond \u2014 this is just a pointer so you can find things fast mid-session.';
      el.appendChild(note);
      const table = document.createElement('table');
      table.className = 'ddb-table';
      table.innerHTML = `<tr><th>Name</th><th>What it is</th><th>Where in D&D Beyond</th><th></th></tr>`;
      ch.rows.forEach((row, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td contenteditable="true">${row.name}</td><td contenteditable="true">${row.what}</td><td contenteditable="true">${row.where}</td><td><button class="remove-row">✕</button></td>`;
        const tds = tr.querySelectorAll('td[contenteditable]');
        tds[0].addEventListener('input', e => { row.name = e.target.innerText; scheduleSave(); });
        tds[1].addEventListener('input', e => { row.what = e.target.innerText; scheduleSave(); });
        tds[2].addEventListener('input', e => { row.where = e.target.innerText; scheduleSave(); });
        tr.querySelector('.remove-row').addEventListener('click', () => { ch.rows.splice(i,1); render(); showView(ch.id); scheduleSave(); });
        table.appendChild(tr);
      });
      el.appendChild(table);
      const addBtn = document.createElement('button');
      addBtn.className = 'add-row'; addBtn.textContent = '+ Add entry';
      addBtn.addEventListener('click', () => { ch.rows.push({name:'New NPC/Monster', what:'', where:''}); render(); showView(ch.id); scheduleSave(); });
      el.appendChild(addBtn);
    }

    if(ch.type === 'checklist'){
      const wrap = document.createElement('div'); wrap.className = 'checklist';
      ch.items.forEach((item, i) => {
        const label = document.createElement('label');
        if(item.checked) label.classList.add('checked');
        label.innerHTML = `<input type="checkbox" ${item.checked?'checked':''}><span class="check-text" contenteditable="true">${item.text}</span><button class="remove-check">✕</button>`;
        const cb = label.querySelector('input');
        cb.addEventListener('change', () => { item.checked = cb.checked; label.classList.toggle('checked', cb.checked); scheduleSave(); });
        label.querySelector('.check-text').addEventListener('input', e => { item.text = e.target.innerText; scheduleSave(); });
        label.querySelector('.remove-check').addEventListener('click', () => { ch.items.splice(i,1); render(); showView(ch.id); scheduleSave(); });
        wrap.appendChild(label);
      });
      el.appendChild(wrap);
      const addBtn = document.createElement('button'); addBtn.className = 'add-check'; addBtn.textContent = '+ Add item';
      addBtn.addEventListener('click', () => { ch.items.push({text:'New item', checked:false}); render(); showView(ch.id); scheduleSave(); });
      el.appendChild(addBtn);
    }

    if(ch.type === 'log'){
      const wrap = document.createElement('div');
      ch.entries.forEach((entry, i) => {
        const div = document.createElement('div'); div.className = 'log-entry';
        div.innerHTML = `<div class="log-date"><input type="text" value="${entry.date}" placeholder="Date / Session #"><button class="remove-log">✕</button></div>
          <div class="content" contenteditable="true">${entry.text}</div>`;
        div.querySelector('input').addEventListener('input', e => { entry.date = e.target.value; scheduleSave(); });
        div.querySelector('.content').addEventListener('input', e => { entry.text = e.target.innerHTML; scheduleSave(); });
        div.querySelector('.remove-log').addEventListener('click', () => { ch.entries.splice(i,1); render(); showView(ch.id); scheduleSave(); });
        wrap.appendChild(div);
      });
      el.appendChild(wrap);
      const addBtn = document.createElement('button'); addBtn.className = 'add-log'; addBtn.textContent = '+ Add session entry';
      addBtn.addEventListener('click', () => { ch.entries.unshift({date:'New session', text:'What happened…'}); render(); showView(ch.id); scheduleSave(); });
      el.appendChild(addBtn);
    }
    const backWrap = document.createElement('button');
    backWrap.className = 'bottom-back-btn';
    backWrap.textContent = '← Back';
    backWrap.addEventListener('click', () => goBack());
    el.appendChild(backWrap);

    container.appendChild(el);
  });

  renderSidebar();
  showView(currentView);
  applyEditability();
  buildSearchIndex();
}

function addChapter(){
  const n = data.chapters.length + 1;
  const newCh = { id:'c'+Date.now(), num:'Chapter '+n, title:'New Chapter', type:'html', content:'<p>Start writing…</p>' };
  data.chapters.push(newCh);
  render();
  showView(newCh.id);
  scheduleSave();
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('Reset everything back to the original DM Bible? This discards your edits.')){ data = deepClone(DEFAULT_DATA); currentView = 'glossary'; render(); scheduleSave(); }
});
document.getElementById('exportBtn').addEventListener('click', () => {
  let text = 'THE DADS — DM BIBLE\n\n';
  data.chapters.forEach(ch => {
    text += `${ch.num}: ${ch.title}\n${'-'.repeat(40)}\n`;
    if(ch.type === 'html'){ const tmp=document.createElement('div'); tmp.innerHTML=ch.content; text += tmp.innerText + '\n\n'; }
    else if(ch.type === 'ddb'){ ch.rows.forEach(r => { text += `${r.name} — ${r.what} — D&D Beyond: ${r.where}\n`; }); text += '\n'; }
    else if(ch.type === 'checklist'){ ch.items.forEach(i => { text += `[${i.checked?'x':' '}] ${i.text}\n`; }); text += '\n'; }
    else if(ch.type === 'log'){ ch.entries.forEach(e => { const tmp=document.createElement('div'); tmp.innerHTML=e.text; text += `${e.date}\n${tmp.innerText}\n\n`; }); }
  });
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'the-dads-dm-bible.txt'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

/* ---------- Search ---------- */
// Indexes every chapter title, plus every h3 heading inside each chapter's
// content, so you can jump straight to a topic without knowing which
// chapter it lives in. Rebuilt every render() so it never goes stale.
let searchIndex = [];

function buildSearchIndex(){
  searchIndex = [];
  data.chapters.forEach(ch => {
    searchIndex.push({ name: ch.title, viewId: ch.id, type: 'chapter' });
    if(ch.type === 'html' && ch.content){
      const tmp = document.createElement('div');
      tmp.innerHTML = ch.content;
      tmp.querySelectorAll('h3').forEach(h => {
        const name = h.textContent.trim();
        if(name) searchIndex.push({ name, viewId: ch.id, type: ch.title });
      });
    }
  });
}

function runSearch(query){
  const box = document.getElementById('searchResults');
  query = query.trim().toLowerCase();
  if(!query){ box.innerHTML = ''; box.classList.remove('open'); return; }
  const matches = searchIndex.filter(i => i.name.toLowerCase().includes(query)).slice(0, 12);
  if(!matches.length){ box.innerHTML = '<div class="search-empty">No matches</div>'; box.classList.add('open'); return; }
  box.innerHTML = matches.map(m =>
    `<a href="#" class="search-result" data-view="${m.viewId}">${m.name}<span class="search-result-type">${m.type}</span></a>`
  ).join('');
  box.classList.add('open');
}

document.getElementById('siteSearch').addEventListener('input', e => runSearch(e.target.value));
document.addEventListener('click', e => {
  const result = e.target.closest('.search-result');
  if(result){
    e.preventDefault();
    showView(result.dataset.view);
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchResults').classList.remove('open');
    document.getElementById('siteSearch').value = '';
    return;
  }
  if(!e.target.closest('.topbar-search')){
    document.getElementById('searchResults').classList.remove('open');
  }
});

document.getElementById('modeToggle').addEventListener('click', () => {
  sessionView = !sessionView;
  document.body.classList.toggle('session-view', sessionView);
  document.getElementById('modeToggle').textContent = sessionView ? 'Edit Mode' : 'Session View';
  applyEditability();
});

loadData();
</script>
