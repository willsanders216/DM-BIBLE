<div class="scene-block">
  <div class="scene-title">Scene 2 — Chase &amp; Boarding</div>
  <div class="setup-box"><span class="sb-label">Setting the scene</span>Brief false calm (~10 sec in-fiction) right after the boat roleplay — party thinks they've gotten away. Then sails appear on the horizon.</div>

  <div class="beat-box"><span class="bb-label">The reveal</span><ul>
    <li>Sails spotted first — unclear who, at a distance</li>
    <li>As it closes, party recognizes the guard from the <span class="xref" onclick="return jumpTo('npc-biggie','Biggie Wiggie')">Biggie</span> chase among the crew</li>
    <li>A few more ships come into view — the whole pack starts closing distance</li>
    <li>Turn it over to the players here: "What do you want to do?"</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Pacing target</span><ul><li>~30 min: false calm → sails spotted → recognition → chase → Willowheart boards</li></ul></div>

  <div class="beat-box"><span class="bb-label">The pursuit</span><ul>
    <li>Not one pursuer — chaotic mixed pursuit</li>
    <li>Uniform navy fleet: 3-4 ships total, including the guard's — all identical to the party's own ship (it <em>is</em> a navy ship), all closing at the same speed</li>
    <li>No formation — just uniformly closing in from behind, chaotic scene, no lead ship pulling ahead</li>
    <li>Run it puzzly/inventive, not a fixed mechanic — let players propose actions (drop cargo, cut a pursuer's rigging, magic to becalm sails/conjure fog, fire on pursuers)</li>
    <li>Assign difficulty/consequence per action rather than one universal check</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Terrain — cluster of rocks</span><ul>
    <li>A cluster of rocks lies in the chase path — a possible escape route, but deliberately left open</li>
    <li>Don't decide for them whether it's used — purely a player choice at the table</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">What's aboard — improvisable resources</span><ul>
    <li>Cannonballs and gunpowder — well stocked for the ship's own cannons</li>
    <li>Spare sailcloth and rope — for jury-rigging a torn sail or lashing something together fast</li>
    <li>A few barrels of oil/lamp oil — throwable or lightable as a fire hazard behind them</li>
    <li>Empty crates and spare cargo — can be jettisoned to lighten the ship for speed</li>
    <li>Grappling hooks — for snagging a pursuer, or stopping one from snagging them</li>
    <li>Normal ship's crew — can be ordered to jobs like reefing sails or manning a second cannon</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Basic chase &amp; ship combat rules</span><ul>
    <li>Each player picks a <strong>crew role</strong> for the chase (see roles below) — full breakdown also in the Player Bible's new Ship Combat Roles page</li>
    <li>On their turn, each player gets their normal action, <em>plus</em> one ship action tied to their role</li>
    <li><strong>Helmsman</strong> — steers the ship; handles checks to turn, dodge, or outmaneuver a pursuer</li>
    <li><strong>Gunner</strong> — aims and fires the cannons at a pursuing ship</li>
    <li><strong>Quartermaster / First Mate</strong> — assists any other role, granting a bonus to that role's check</li>
    <li><strong>Lookout</strong> — spots hazards or threats early (e.g. the rock cluster, a pursuer closing faster than expected)</li>
    <li><strong>Boarding / Repairs</strong> — deals with damage control, or fights off anyone trying to board</li>
    <li>Keep it lightweight — assign a DC per proposed action rather than running a rigid turn structure</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Ship vs. ship — Willowheart attacks on sight</span><ul>
    <li><span class="xref" onclick="return toggleCard('sp-willowheart')">Willowheart</span>'s ship catches up, sees they're on a navy vessel, reads them as hostile navy — no hesitation, no hail first</li>
    <li>Opens as a ship vs. ship fight using the crew-role chase/combat system above</li>
    <li>Once ships are close, she boards</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Boarding &amp; melee</span><ul>
    <li>Willowheart + 2 pirates board (chip below) — sized for a ~20 min fight total, not a bigger mob</li>
    <li>Stat blocks: Will's own, built in D&amp;D Beyond VTT — Willowheart as a custom monster/NPC, 2 pirates as standard stat blocks</li>
    <li>Her line on boarding: <em>"I don't know what you lot think you're doing, but the captain's not gonna like this."</em></li>
    <li>Straight into melee from there</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Stand-down — Willowheart submits</span><ul>
    <li>Mid-fight, <span class="xref" onclick="return toggleCard('sp-shipoo-2')">Shipoo</span> reveals herself (was hiding to avoid trouble with <span class="xref" onclick="return jumpTo('npc-snarlywinkle','Captain Snarlywinkle')">Snarlywinkle</span>)</li>
    <li>Appeals on shared goal of finding <span class="xref" onclick="return jumpTo('npc-pooguey','Pooguey')">Poo</span> — tips the fight</li>
    <li>Willowheart submits (rather than a mutual stand-down) — fight ends</li>
    <li>Note: Will wants Willowheart as a potential recurring NPC who could follow the party going forward</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Interrogation &amp; negotiation — after she submits</span><ul>
    <li>Party interrogates her re: ditching siege prep, now that the fighting's over</li>
    <li>Her default posture: guarded and non-committal — testing the party's intentions rather than opening up right away</li>
    <li>She only turns/reveals anything meaningful if the party explicitly offers to help her cause (the mutiny against <span class="xref" onclick="return jumpTo('npc-snarlywinkle','Captain Snarlywinkle')">Snarlywinkle</span>, or finding <span class="xref" onclick="return jumpTo('npc-pooguey','Pooguey')">Poo</span>)</li>
    <li>If they don't make that offer clearly, she stays cagey — a good candidate to resurface later rather than resolve fully today</li>
    <li>Branches from there: help her mutiny against Snarlywinkle / steer her toward just finding Poo instead / other outcomes depending on party approach — read the table</li>
  </ul></div>

  <div class="npc-chip-row">
    <button class="npc-chip" onclick="return toggleCard('sp-willowheart')">Willowheart<span class="chip-sub">druid first mate — new</span></button>
    <button class="npc-chip" onclick="return toggleCard('sp-shipoo-2')">Shipoo<span class="chip-sub">reveal, this scene</span></button>
  </div>

    <div class="npc-quote"><span class="npc-quote-label">Line</span>"I need to find a way to lift the ban on piracy."</div>
    <div class="npc-ddb-note">New — add D&amp;D Beyond sheet if needed</div>

    <div class="card-name">Shipoo <span class="tag">also in Scene 1</span></div>
    <h4>This scene</h4><ul><li>Had been hiding to avoid trouble with Snarlywinkle</li><li>Reveals herself mid-fight to stop Willowheart</li><li>Appeals on shared goal of finding Poo</li></ul>
    <div class="npc-ddb-note">Sheet: D&amp;D Beyond · full card in Scene 1</div>

  <div class="setup-box" style="margin-top:12px;"><span class="sb-label">Visual aid — D&amp;D Beyond Maps</span>Upload a top-down ship deck image as one map (boarding/on-ship positioning), plus a simple zoomed-out ocean map with two ship tokens (red = hostile, green = party) for chase positioning. Flip between the two as needed.</div>

<div class="scene-block">
  <div class="scene-title">Scene 3 — Resupply &amp; the Journey to the Crow's Nest</div>
  <div class="setup-box"><span class="sb-label">Setting the scene</span>Mostly roleplay/logistics, low on mechanics. Party works out supplies and plans the route with the crew — likely heavy chat with <span class="xref" onclick="return toggleCard('sp-chefs')">Jezebel &amp; Saquiphony</span>, and <span class="xref" onclick="return toggleCard('sp-willowheart')">Willowheart</span> if she's tagging along (may be roped into grabbing food from her old ship).</div>

  <div class="beat-box"><span class="bb-label">The journey</span><ul>
    <li>Roughly a 4-5 day sail to the <span class="xref" onclick="return jumpTo('boundary-crowsnest','the crow\'s nest')">Crow's Nest</span></li>
    <li>On the way, the party passes <span class="xref" onclick="return jumpTo('boundary-nomansland','No Man\'s Land')">No Man's Land</span> — a premonition of something each of them desires draws them toward it; entirely the party's choice whether to stop and investigate</li>
    <li>Puzzle photos from the previous run still need uploading to Discord/D&amp;D Beyond before this comes up</li>
  </ul></div>

  <div class="npc-chip-row">
    <button class="npc-chip" onclick="return toggleCard('sp-nomansland-detail')">No Man's Land — full plan<span class="chip-sub">tap to expand</span></button>
  </div>

  <div class="npc-card" id="sp-nomansland-detail">
    <div class="card-name">No Man's Land <span class="tag">full arc, ran as 2 sessions previously</span></div>

    <div class="beat-box"><span class="bb-label">Arrival — greeted on the dock</span><ul>
      <li>Party greeted right on the dock by <strong>Mother</strong> — warm, welcoming: "Welcome to my home. I hope you'll make yourselves comfortable. You're completely welcome."</li>
      <li>Invites them to dinner that evening at her tower to "get them settled in" and "become part of the family"</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">The town — surface illusion</span><ul>
      <li>~20 houses, but most are empty — only reads as lived-in/bustling at a glance</li>
      <li>Shopping options available</li>
      <li>Tavern: patrons gambling, drinking, cards — but bartenders/staff are spirits compelled to serve, going through the motions with nothing real to pour. Unresponsive, mechanically competent</li>
      <li>None of it is real — the whole town is Mother's illusion (payoff below)</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">The dead man &amp; the note (tavern)</span><ul>
      <li>Mysterious figure in the tavern corner — actually dead, holding a note</li>
      <li>Was a member of the original prophecy captain's first crew, searching for him after losing track of him</li>
      <li>Note guides the party to his house</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">The one occupied house — secret basement</span><ul>
      <li>Of the ~20 houses, this is the one that matters — outwardly also reads as mostly empty</li>
      <li>Hidden entrance down to a secret basement</li>
      <li>Contains: the dead man's full notes on Mother and the original captain; a stash of bullywug hats; a chained-up bullywug skeleton</li>
      <li>Notes reveal the island's bullywugs are immune to Mother's charm magic — it's the hats granting immunity</li>
      <li>Party can take/wear the hats to reduce their own susceptibility before dinner</li>
      <li>Living bullywugs are a likely encounter while exploring above ground</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">Dinner with Mother — first confrontation</span><ul>
      <li>That evening, party goes up to Mother's tower for dinner as invited</li>
      <li>First real confrontation — branches depending on the party/session:</li>
      <li>— They agree to side with her / become "family" (help trap people), or</li>
      <li>— She tries to bind them tighter under her control — may spark a short fight, time/pacing dependent, DM's call</li>
      <li>Escalates into the tower puzzle sequence below</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">The tower collapses into a puzzle gauntlet</span><ul>
      <li>Mother vanishes from the top floor mid-confrontation</li>
      <li>Tower becomes a descending puzzle-gauntlet, one stage at a time — <strong>final puzzle list, replaces earlier draft:</strong></li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">Puzzle 1 — the 26 Voice Stones</span><ul>
      <li>Shipoo (well-read) can identify what the stones are if asked</li>
      <li>Undisclosed rule (don't tell players outright): each word spoken to a stone must start with the next unused letter of the alphabet, A through Z in order, across the whole party's attempts collectively — not per-player</li>
      <li>All 26 stones lit unlocks the door</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">Puzzle 2 — the Mouth in the Wall</span><ul>
      <li>Empty room; a mouth in the wall says "Show me something beautiful"</li>
      <li>Door opens on any beautiful offering — DM judgment call on what counts</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">Puzzle 3 — the Three Doors</span><ul>
      <li>Classic truth-teller / liar logic puzzle — two guards, one always lies, one always tells the truth</li>
      <li>Third guard isn't part of the logic puzzle at all — he just cries at everything said to him</li>
      <li>His door is a dead-end: just a chair and a candle inside</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">Puzzle 4 — optional, time-permitting</span><ul>
      <li>Simplified replacement for a puzzle that flopped in the previous run</li>
      <li>Two roles only, no turn structure: <strong>Player One</strong> moves blind through a 5ft-tile grid (traps, loot, a patrolling monster); <strong>Player Two</strong> can see everything and narrates freely to guide them, no communication restrictions</li>
      <li>Cut this one first if the session's running long</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">After the puzzles</span><ul>
      <li>The floor gives way — party falls into a swamp/pond cave below the tower</li>
      <li>Inside: a giant beast skull repurposed as a house, containing newspapers/notes</li>
      <li>Among them: the trapped prophecy captain's journal note, plus a set of increasingly strange drawings</li>
      <li>Mother traps the party in roots for several days here before the fight actually begins</li>
    </ul></div>

    <div class="beat-box"><span class="bb-label">Aftermath — once Mother is defeated</span><ul>
      <li>Bullywugs appear for a pool party in the lake</li>
      <li>The party's ship (which vanished the moment they entered the Tower) reappears</li>
      <li>Party is free to leave</li>
    </ul></div>

    <div class="npc-ddb-note"><strong>Confirmed:</strong> skipping the Tower entirely changes nothing content-wise — it just means the party reaches the <span class="xref" onclick="return jumpTo('boundary-crowsnest','the crow\'s nest')">Crow's Nest</span> sooner. If skipped, pad Crow's Nest content as a buffer.</div>

    <div class="npc-quote"><span class="npc-quote-label">Secret — what the tower actually is</span>The entire tower is built from charmed, living, innocent people, held in the formation of a tower by Mother's magic. Once she dies, it collapses into a huge black lake — a chest of gold sits at the bottom. Land this as a gut-punch, not a passing detail.</div>
    <div class="npc-quote"><span class="npc-quote-label">Secret — the town is illusion too</span>The real island doesn't look anything like the mostly-empty little town the party sees. Not yet decided what it looks like underneath outside of the tower/lake reveal — keep flexible for the table.</div>

    <div class="beat-box" style="border-color:#a33;"><span class="bb-label">⚠ Mother — boss fight (design spec, NOT yet built in D&amp;D Beyond)</span><ul>
      <li>Two-phase fight. Combatants: 3 level-5 PCs (<span class="xref" onclick="return jumpTo('player-billy','Billy Buckeye')">Billy</span>, <span class="xref" onclick="return jumpTo('player-orin','Orin the Jackhammer')">Orin</span>, <span class="xref" onclick="return jumpTo('player-cheesenwine','Cheese n Wine')">Cheese n Wine</span>) + <span class="xref" onclick="return toggleCard('sp-mercy')">Mercy</span>, Willow, <span class="xref" onclick="return toggleCard('sp-jeoph')">Jeoph</span> as weak active combatants (d6/d8 hits, miss often). <span class="xref" onclick="return toggleCard('sp-chefs')">Jezebel, Saquiphony</span>, <span class="xref" onclick="return toggleCard('sp-steven')">Steven</span>, <span class="xref" onclick="return toggleCard('sp-shipoo-2')">Shipoo</span> present narratively only, not fighting</li>
    </ul></div>
    <div class="beat-box"><span class="bb-label">Phase 1 — Banshee-Touched</span><ul>
      <li>AC 14, HP ~90 (of ~130 total), fly 40ft, Incorporeal Glide, resistant to nonmagical bludgeoning/piercing/slashing</li>
      <li>Multiattack: 2× Chilling Touch (+6 to hit, 2d6+3 necrotic)</li>
      <li>Wail (recharge 5–6): 20ft radius, DC14 CON save, fail = frightened + 2d8 psychic</li>
      <li>Legendary actions (3/round): Move, Chilling Touch, Summon the Deep (spawns a Grasping Tentacle add — stats below)</li>
      <li><strong>Transition:</strong> ceiling opens, bodies rain down, DEX save vs. suffocation/burial — party ends up fighting atop the resulting body pile. Banshee form vanishes; Mother reforms as a "throne of bodies"</li>
    </ul></div>
    <div class="beat-box"><span class="bb-label">Phase 2 — Sea Hag Ascendant</span><ul>
      <li>Triggers at ~45 HP remaining. Gets a temp HP burst on transition</li>
      <li>AC 16, loses flight, swim 40ft, Regeneration 5/turn (unless hit by fire or radiant damage on the previous turn)</li>
      <li>Death Glare (recharge 6): DC14 WIS save, paralyzes a target already frightened</li>
      <li>Multiattack: 2× Claw (+7 to hit, 2d8+4 slashing)</li>
      <li>Raise the Drowned (recharge 5–6): summons 2 standard Skeletons — pull the stock D&amp;D Beyond stat block as-is, no changes</li>
      <li>Legendary actions: Move, Claw, Raise the Drowned</li>
    </ul></div>
    <div class="beat-box"><span class="bb-label">Add — Grasping Tentacle</span><ul>
      <li>AC 11, HP 15, +5 to hit, 1d8+3 bludgeoning + grapple (DC13 STR to escape). Can't move</li>
    </ul></div>
    <div class="npc-ddb-note">⚠ Mother is homebrew and does not exist in D&amp;D Beyond yet — the two-phase stat block above is the full design spec. Build her as a custom monster in the VTT before this fight is run, then this box can be trimmed down to a pointer.</div>
  </div>

  <div class="npc-ddb-note">What follows this scene — Crow's Nest arrival — is now planned in full below (Scenes 4 &amp; 5).</div>
</div>

  <div class="beat-box"><span class="bb-label">Checkpoint 1 — boat search</span><ul>
    <li>Silent, all-business guard. No roleplay hook here — pure process</li>
    <li>Searches the boat, waves them through to checkpoint 2</li>
  </ul></div>

  <div class="beat-box"><span class="bb-label">Checkpoint 2 — declaration &amp; entry fee</span><ul>
    <li>Handled by <span class="xref" onclick="return toggleCard('sp-bartrude')">Bartrude</span> — friendly, jokey, handles the declaration and entry fee</li>
    <li>Openly amused once he learns they're broke — upfront that they're in for a rough time. Banter, not cruelty</li>
  </ul></div>

  <div class="npc-chip-row">
    <button class="npc-chip" onclick="return toggleCard('sp-bartrude')">Bartrude<span class="chip-sub">friendly, jokey guard</span></button>
  </div>

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function applyEditability(){
  document.querySelectorAll('.content[contenteditable], .chapter-title[contenteditable], .check-text[contenteditable], td[contenteditable]').forEach(el => {
    el.contentEditable = sessionView ? 'false' : 'true';
  });
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    data = res && res.value ? JSON.parse(res.value) : deepClone(DEFAULT_DATA);
  }catch(e){ data = deepClone(DEFAULT_DATA); }
  render();
  setSaveStatus('saved');
}
function setSaveStatus(state){
  const bar = document.getElementById('savebar');
  const label = document.getElementById('saveLabel');
  if(state==='saving'){ bar.classList.remove('saved'); label.textContent='Saving…'; }
  else if(state==='saved'){ bar.classList.add('saved'); label.textContent='All changes saved'; }
  else { bar.classList.remove('saved'); label.textContent='Loading…'; }
}
function scheduleSave(){
  setSaveStatus('saving');
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(data)); setSaveStatus('saved'); }
    catch(e){ console.error('Save failed', e); }
  }, 500);
}

function slugify(text){
  return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function toggleNpcPanel(){

  if(panel) panel.classList.toggle('open');
  if(overlay) overlay.classList.toggle('open');
}

function injectSpNpcPanel(){
  if(document.getElementById('spNpcPanelToggle')) return; // already present
  const wrap = document.createElement('div');
  wrap.id = 'spNpcPanelWrap';
  wrap.innerHTML = SP_NPC_PANEL_HTML;
  document.body.appendChild(wrap);
  document.getElementById('spNpcPanelToggle').addEventListener('click', toggleNpcPanel);
  document.getElementById('spNpcPanelClose').addEventListener('click', toggleNpcPanel);
  document.getElementById('spNpcPanelOverlay').addEventListener('click', toggleNpcPanel);
}

function removeSpNpcPanel(){
  const wrap = document.getElementById('spNpcPanelWrap');
  if(wrap) wrap.remove();
}

// Cross-reference jump: switch chapters, then scroll to the specific h3
// heading whose text matches `anchorText` (case-insensitive, slugified).
function jumpTo(viewId, anchorText){
  showView(viewId);
  setTimeout(() => {
    const id = slugify(anchorText);
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 50);
  return false;
}

function showCalMonth(month, btn){
  document.querySelectorAll('.calendar-month').forEach(m => m.classList.remove('active'));
  document.getElementById('cal-' + month).classList.add('active');
  document.querySelectorAll('.calendar-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

function showView(viewId, isBack){
  if(!isBack && currentView && currentView !== viewId){
    viewHistory.push(currentView);
  }
  currentView = viewId;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const target = document.getElementById('view-' + viewId);
  if(target) target.classList.add('active');
  document.querySelectorAll('#sidebarNav a').forEach(a => a.classList.remove('active'));
  const navLink = document.querySelector('#sidebarNav a[data-view="' + viewId + '"]');
  if(navLink) navLink.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  if(viewId === 'session-plan'){ injectSpNpcPanel(); } else { removeSpNpcPanel(); }
  window.scrollTo(0,0);
}

function goBack(){
  if(!viewHistory.length) return;
  const prev = viewHistory.pop();
  showView(prev, true);
}

function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  const glossaryLink = document.createElement('a');
  glossaryLink.href = '#'; glossaryLink.dataset.view = 'glossary'; glossaryLink.textContent = 'Glossary';
  glossaryLink.addEventListener('click', e => { e.preventDefault(); showView('glossary'); });
  nav.appendChild(glossaryLink);
  const hr = document.createElement('hr'); hr.className = 'divider-line';
  nav.appendChild(hr);
  data.chapters.filter(ch => !ch.sub && !ch.sessionPlan).forEach(ch => {
    const a = document.createElement('a');
    a.href = '#'; a.dataset.view = ch.id; a.textContent = ch.title;
    a.addEventListener('click', e => { e.preventDefault(); showView(ch.id); });
    nav.appendChild(a);
  });
  const spChapter = data.chapters.find(ch => ch.sessionPlan);
  if(spChapter){
    const spBtn = document.createElement('a');
    spBtn.href = '#'; spBtn.dataset.view = spChapter.id; spBtn.className = 'session-plan-nav-btn';
    spBtn.textContent = spChapter.title;
    spBtn.addEventListener('click', e => { e.preventDefault(); showView(spChapter.id); });
    nav.appendChild(spBtn);
  }
  const active = document.querySelector('#sidebarNav a[data-view="' + currentView + '"]');
  if(active) active.classList.add('active');
}

function renderGlossaryView(){
  const wrap = document.createElement('section');
  wrap.className = 'view'; wrap.id = 'view-glossary';
  const head = document.createElement('div');
  head.className = 'view-head';
  head.innerHTML = `<div class="eyebrow">Quick Index</div><h1>Glossary</h1>`;
  wrap.appendChild(head);
  const note = document.createElement('p');
  note.style.fontSize = '14px'; note.style.color = '#6b5a3a'; note.style.fontStyle = 'italic';
  note.textContent = 'Every top-level chapter, one tap away. Sub-pages (individual NPCs, islands, players, artifacts) live inside their hub chapter, or find them with search.';
  wrap.appendChild(note);
  const grid = document.createElement('div');
  grid.className = 'glossary-grid';
  data.chapters.filter(ch => !ch.sub && !ch.sessionPlan).forEach(ch => {
    const a = document.createElement('a');
    a.href = '#'; a.className = 'glossary-card';
    a.innerHTML = `<div class="gnum">${ch.num}</div><div class="gtitle">${ch.title}</div>`;
    a.addEventListener('click', e => { e.preventDefault(); showView(ch.id); });
    grid.appendChild(a);
  });
  wrap.appendChild(grid);
  const addBtn = document.createElement('button');
  addBtn.className = 'add-chapter-inline';
  addBtn.textContent = '+ Add a new chapter';
  addBtn.addEventListener('click', addChapter);
  wrap.appendChild(addBtn);
  return wrap;
}

function render(){
  const container = document.getElementById('views');
  container.innerHTML = '';
  container.appendChild(renderGlossaryView());

  data.chapters.forEach((ch) => {
    const el = document.createElement('section');
    el.className = 'view';
    el.id = 'view-' + ch.id;
    const head = document.createElement('div');
    head.className = 'view-head';
    head.innerHTML = `<div class="eyebrow">${ch.sub ? 'Reference' : ch.num}</div><h1 class="chapter-title" contenteditable="true">${ch.title}</h1>`;
    el.appendChild(head);
    head.querySelector('.chapter-title').addEventListener('input', e => { ch.title = e.target.innerText; renderSidebar(); scheduleSave(); });

    const actions = document.createElement('div');
    actions.className = 'chapter-actions';
    actions.innerHTML = `<button data-action="delete">Delete Chapter</button>`;
    actions.querySelector('[data-action="delete"]').addEventListener('click', () => {
      if(confirm(`Delete "${ch.title}"?`)){ data.chapters = data.chapters.filter(c => c.id !== ch.id); showView('glossary'); render(); scheduleSave(); }
    });
    el.appendChild(actions);

    if(ch.type === 'html'){
      const content = document.createElement('div');
      content.className = 'content'; content.contentEditable = 'true'; content.innerHTML = ch.content;
      content.querySelectorAll('h3').forEach(h => {
        if(!h.id) h.id = slugify(h.textContent);
      });
      content.addEventListener('input', () => { ch.content = content.innerHTML; scheduleSave(); });
      el.appendChild(content);
    }

    if(ch.type === 'ddb'){
      const note = document.createElement('p');
      note.style.fontSize = '13px'; note.style.fontStyle = 'italic'; note.style.color = '#6b5a3a';
      note.textContent = 'Full stat blocks and initiative live in D\u2019D Beyond \u2014 this is just a pointer so you can find things fast mid-session.';
      el.appendChild(note);
      const table = document.createElement('table');
      table.className = 'ddb-table';
      table.innerHTML = `<tr><th>Name</th><th>What it is</th><th>Where in D&D Beyond</th><th></th></tr>`;
      ch.rows.forEach((row, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td contenteditable="true">${row.name}</td><td contenteditable="true">${row.what}</td><td contenteditable="true">${row.where}</td><td><button class="remove-row">✕</button></td>`;
        const tds = tr.querySelectorAll('td[contenteditable]');
        tds[0].addEventListener('input', e => { row.name = e.target.innerText; scheduleSave(); });
        tds[1].addEventListener('input', e => { row.what = e.target.innerText; scheduleSave(); });
        tds[2].addEventListener('input', e => { row.where = e.target.innerText; scheduleSave(); });
        tr.querySelector('.remove-row').addEventListener('click', () => { ch.rows.splice(i,1); render(); showView(ch.id); scheduleSave(); });
        table.appendChild(tr);
      });
      el.appendChild(table);
      const addBtn = document.createElement('button');
      addBtn.className = 'add-row'; addBtn.textContent = '+ Add entry';
      addBtn.addEventListener('click', () => { ch.rows.push({name:'New NPC/Monster', what:'', where:''}); render(); showView(ch.id); scheduleSave(); });
      el.appendChild(addBtn);
    }

    if(ch.type === 'checklist'){
      const wrap = document.createElement('div'); wrap.className = 'checklist';
      ch.items.forEach((item, i) => {
        const label = document.createElement('label');
        if(item.checked) label.classList.add('checked');
        label.innerHTML = `<input type="checkbox" ${item.checked?'checked':''}><span class="check-text" contenteditable="true">${item.text}</span><button class="remove-check">✕</button>`;
        const cb = label.querySelector('input');
        cb.addEventListener('change', () => { item.checked = cb.checked; label.classList.toggle('checked', cb.checked); scheduleSave(); });
        label.querySelector('.check-text').addEventListener('input', e => { item.text = e.target.innerText; scheduleSave(); });
        label.querySelector('.remove-check').addEventListener('click', () => { ch.items.splice(i,1); render(); showView(ch.id); scheduleSave(); });
        wrap.appendChild(label);
      });
      el.appendChild(wrap);
      const addBtn = document.createElement('button'); addBtn.className = 'add-check'; addBtn.textContent = '+ Add item';
      addBtn.addEventListener('click', () => { ch.items.push({text:'New item', checked:false}); render(); showView(ch.id); scheduleSave(); });
      el.appendChild(addBtn);
    }

    if(ch.type === 'log'){
      const wrap = document.createElement('div');
      ch.entries.forEach((entry, i) => {
        const div = document.createElement('div'); div.className = 'log-entry';
        div.innerHTML = `<div class="log-date"><input type="text" value="${entry.date}" placeholder="Date / Session #"><button class="remove-log">✕</button></div>
          <div class="content" contenteditable="true">${entry.text}</div>`;
        div.querySelector('input').addEventListener('input', e => { entry.date = e.target.value; scheduleSave(); });
        div.querySelector('.content').addEventListener('input', e => { entry.text = e.target.innerHTML; scheduleSave(); });
        div.querySelector('.remove-log').addEventListener('click', () => { ch.entries.splice(i,1); render(); showView(ch.id); scheduleSave(); });
        wrap.appendChild(div);
      });
      el.appendChild(wrap);
      const addBtn = document.createElement('button'); addBtn.className = 'add-log'; addBtn.textContent = '+ Add session entry';
      addBtn.addEventListener('click', () => { ch.entries.unshift({date:'New session', text:'What happened…'}); render(); showView(ch.id); scheduleSave(); });
      el.appendChild(addBtn);
    }
    const backWrap = document.createElement('button');
    backWrap.className = 'bottom-back-btn';
    backWrap.textContent = '← Back';
    backWrap.addEventListener('click', () => goBack());
    el.appendChild(backWrap);

    container.appendChild(el);
  });

  renderSidebar();
  showView(currentView);
  applyEditability();
  buildSearchIndex();
}

function addChapter(){
  const n = data.chapters.length + 1;
  const newCh = { id:'c'+Date.now(), num:'Chapter '+n, title:'New Chapter', type:'html', content:'<p>Start writing…</p>' };
  data.chapters.push(newCh);
  render();
  showView(newCh.id);
  scheduleSave();
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('Reset everything back to the original DM Bible? This discards your edits.')){ data = deepClone(DEFAULT_DATA); currentView = 'glossary'; render(); scheduleSave(); }
});
document.getElementById('exportBtn').addEventListener('click', () => {
  let text = 'THE DADS — DM BIBLE\n\n';
  data.chapters.forEach(ch => {
    text += `${ch.num}: ${ch.title}\n${'-'.repeat(40)}\n`;
    if(ch.type === 'html'){ const tmp=document.createElement('div'); tmp.innerHTML=ch.content; text += tmp.innerText + '\n\n'; }
    else if(ch.type === 'ddb'){ ch.rows.forEach(r => { text += `${r.name} — ${r.what} — D&D Beyond: ${r.where}\n`; }); text += '\n'; }
    else if(ch.type === 'checklist'){ ch.items.forEach(i => { text += `[${i.checked?'x':' '}] ${i.text}\n`; }); text += '\n'; }
    else if(ch.type === 'log'){ ch.entries.forEach(e => { const tmp=document.createElement('div'); tmp.innerHTML=e.text; text += `${e.date}\n${tmp.innerText}\n\n`; }); }
  });
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'the-dads-dm-bible.txt'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

/* ---------- Search ---------- */
// Indexes every chapter title, plus every h3 heading inside each chapter's
// content, so you can jump straight to a topic without knowing which
// chapter it lives in. Rebuilt every render() so it never goes stale.
let searchIndex = [];

function buildSearchIndex(){
  searchIndex = [];
  data.chapters.forEach(ch => {
    searchIndex.push({ name: ch.title, viewId: ch.id, type: 'chapter' });
    if(ch.type === 'html' && ch.content){
      const tmp = document.createElement('div');
      tmp.innerHTML = ch.content;
      tmp.querySelectorAll('h3').forEach(h => {
        const name = h.textContent.trim();
        if(name) searchIndex.push({ name, viewId: ch.id, type: ch.title });
      });
    }
  });
}

function runSearch(query){
  const box = document.getElementById('searchResults');
  query = query.trim().toLowerCase();
  if(!query){ box.innerHTML = ''; box.classList.remove('open'); return; }
  const matches = searchIndex.filter(i => i.name.toLowerCase().includes(query)).slice(0, 12);
  if(!matches.length){ box.innerHTML = '<div class="search-empty">No matches</div>'; box.classList.add('open'); return; }
  box.innerHTML = matches.map(m =>
    `<a href="#" class="search-result" data-view="${m.viewId}">${m.name}<span class="search-result-type">${m.type}</span></a>`
  ).join('');
  box.classList.add('open');
}

document.getElementById('siteSearch').addEventListener('input', e => runSearch(e.target.value));
document.addEventListener('click', e => {
  const result = e.target.closest('.search-result');
  if(result){
    e.preventDefault();
    showView(result.dataset.view);
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchResults').classList.remove('open');
    document.getElementById('siteSearch').value = '';
    return;
  }
  if(!e.target.closest('.topbar-search')){
    document.getElementById('searchResults').classList.remove('open');
  }
});

document.getElementById('modeToggle').addEventListener('click', () => {
  sessionView = !sessionView;
  document.body.classList.toggle('session-view', sessionView);
  document.getElementById('modeToggle').textContent = sessionView ? 'Edit Mode' : 'Session View';
  applyEditability();
});

loadData();
</script>
